:root{--bg:rgb(57,44,100);--ink:#2b2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgb(57,44,100)}}
:root[data-theme="dark"]{--bg:rgb(57,44,100)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"BlobFont","Chalkboard SE","Comic Sans MS","Marker Felt",sans-serif;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{border:5px solid #1a1030;border-radius:22px;box-shadow:0 8px 0 #1a1030;background:#8fe3ff;max-width:100%;max-height:100%}
:root{--card:#fffdf2;--txt:#2b2140}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#4a3b7a;--txt:#fff}}
:root[data-theme="dark"]{--card:#4a3b7a;--txt:#fff}
#adm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#adm[hidden]{display:none}
#adm .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#adm h2{margin:0 0 10px;font-size:30px;font-weight:400}
#adm button,#adm input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#adm input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#adm button.red{background:#ff6b8b}#adm button.blue{background:#5bb8ff}
#adm p{margin:6px 0;min-height:1.2em}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#auth[hidden]{display:none}
#auth .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#auth h2{margin:0 0 10px;font-size:30px;font-weight:400}
#auth button,#auth input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#auth input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#auth button.red{background:#ff6b8b}#auth button.blue{background:#5bb8ff}
#auth p{margin:6px 0;min-height:1.2em}
#auth input{width:100%;box-sizing:border-box}
#auth .idc{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,#fff6d6 0 12px,#fff0bd 12px 24px);color:#2b2140;box-shadow:0 4px 0 var(--ink);margin-bottom:8px}
#auth .idh{background:#ff6b8b;color:#fff;font-size:22px;letter-spacing:2px;padding:4px 10px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 #2b2140;display:flex;justify-content:space-between}
#auth .idb{display:flex;gap:12px;padding:12px}
#auth #avatar{width:96px;height:96px;border:4px solid var(--ink);border-radius:14px;transform:rotate(-3deg);flex:none;background:#8fe3ff}
#auth .idi{min-width:0;flex:1}
#auth .lbl{font-size:12px;letter-spacing:1px;color:#8a7ba8;margin-top:4px}
#auth .nm{font-size:26px;display:flex;align-items:center;gap:4px;line-height:1.1}
#auth .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#auth .nm button,#auth .nb button{padding:1px 6px;font-size:16px;margin:0}
#auth .nb{display:flex;gap:4px}
#auth .nb input{min-width:0;font-size:18px;padding:3px 6px;margin:0}
#auth .sm{font-size:13px;overflow:hidden;text-overflow:ellipsis}
#auth .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 10px}
#auth .stats div{background:#fff;border:3px solid var(--ink);border-radius:10px;text-align:center;padding:3px 2px}
#auth .stats b{display:block;font-size:22px;font-weight:400}
#auth .stats span{font-size:11px;color:#8a7ba8}
#auth .idf{display:flex;align-items:center;gap:8px;border-top:3px dashed var(--ink);padding:6px 12px;font-size:13px}
#auth .bar{flex:1;height:18px;background:repeating-linear-gradient(90deg,#2b2140 0 2px,transparent 2px 5px,#2b2140 5px 9px,transparent 9px 11px)}
#auth .nm button{display:flex;align-items:center}
#nameDlg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.6)}
#nameDlg[hidden]{display:none}
#nameDlg .dlg{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(80vw,280px)}
#nameDlg h3{margin:0 0 8px;font-size:26px;font-weight:400}
#nameDlg input,#nameDlg button{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#fff;color:#2b2140;width:100%;box-sizing:border-box}
#nameDlg button{width:auto;cursor:pointer;background:#ffd23f}
#nameDlg button.blue{background:#5bb8ff}#nameDlg button.red{background:#ff6b8b}
#nameDlg p{margin:4px 0;min-height:1.2em;color:#ff6b8b}
#joinDlg{position:fixed;z-index:9;touch-action:auto;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.6)}
#joinDlg[hidden]{display:none}
#joinDlg .dlg{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(80vw,280px)}
#joinDlg h3{margin:0 0 8px;font-size:26px;font-weight:400}

  if(h==="propeller"&&t%5===0)parts.push({x:P.x+(r()-.5)*34,y:P.y-50*P.sy,vx:(r()-.5)*.6,vy:-.9,g:0,l:.5,col:"#fff",r:2.5});
  else if(h==="flame"&&t%3===0)parts.push({x:P.x+(r()-.5)*18,y:P.y-34*P.sy,vx:(r()-.5)*.8,vy:-1.4,g:-.04,l:.6,col:["#ff4d4d","#ff8c42","#ffd23f"][r()*3|0],r:4});
  else if(h==="ufo"&&t%5===0)parts.push({x:P.x+(r()-.5)*30,y:P.y-18*P.sy,vx:0,vy:1.2,g:0,l:.6,col:"#7cff6b",r:3});
  else if(h==="disco"&&t%4===0)parts.push({x:P.x+(r()-.5)*50,y:P.y-34*P.sy+(r()-.5)*30,vx:(r()-.5)*.8,vy:-.3,g:0,l:.7,col:`hsl(${r()*360|0},95%,65%)`,sh:"star",r:5});
  else if(h==="raincloud"&&t%4===0)parts.push({x:P.x+(r()-.5)*24,y:P.y-30*P.sy,vx:0,vy:2,g:.1,l:.5,col:"#5bb8ff",r:2});
}
function emitTrail(tr){
  const o={x:P.x+(Math.random()-.5)*12,y:P.y+P.r*.6,vx:(Math.random()-.5),vy:.5,l:.8,col:"#fff",r:4};
  if(tr==="rainbow")o.col=`hsl(${t*8%360},90%,60%)`;
  else if(tr==="spark")o.col="#ffd23f";
  else if(tr==="bubble")o.r=7;
  else if(tr==="leaf"){o.col=Math.random()<.5?"#6bd96b":"#3fae4a";o.vx=(Math.random()-.5)*2;o.vy=-.2;o.g=.05;o.r=5}
  else if(tr==="heart"){o.col="#ff6b8b";o.sh="heart";o.r=6;o.vy=-.6;o.g=0}
  else if(tr==="fire"){o.col=["#ff4d4d","#ff8c42","#ffd23f"][Math.random()*3|0];o.vy=-1.8;o.vx=(Math.random()-.5)*1.2;o.g=-.05;o.r=6;o.l=.6}
  else if(tr==="star"){o.col="#ffd23f";o.sh="star";o.r=6;o.g=.1}
  else if(tr==="galaxy"){o.col=`hsl(${240+Math.random()*80},90%,${60+Math.random()*20}%)`;o.sh=Math.random()<.5?"star":null;o.r=5;o.g=0}
  parts.push(o);
}
function burst(x,y,col,n=10,sp=4){
  if(!ST.fx)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,col,r:3+Math.random()*4})}
}
function pop(x,y,txt,col="#fff"){pops.push({x,y,txt,col,l:1})}

function start(){
  if(state==="play"||state==="shop"||state==="settings"||state==="mp"||state==="lobby"||state==="board"||state==="spectate"||state==="friends"||state==="results")return;
  if(state==="over"&&t-overAt<40)return;
  reset();state="play";beep(520,.15,"triangle",.08,300);
}
let overAt=0;
function gameOver(){
  state="over";overAt=t;shake=14;beep(300,.5,"sawtooth",.08,-250);
  const total=Math.floor(score+bonus);
  gain=coinsTotal+Math.floor(total/200);SV.coins+=gain;SV.total=(SV.total||0)+gain;const hm=Math.floor(maxH/10);if(hm>(SV.bestH||0))SV.bestH=hm;if(total>best){best=total;try{localStorage.setItem("blobbo-best",best)}catch(e){}}
  save();
  burst(P.x,H-30,"#ff6b8b",30,7);
  if(MP.active)mpDied(total);
}

// ---------- Update ----------
function update(){
  t++;
  clouds&&clouds.forEach(cl=>{cl.x+=.15*cl.s;if(cl.x>W+80)cl.x=-80});
  if(state!=="play"){
    if(state==="menu"){P=P||{x:W/2,y:H-120,vx:0,vy:-11,sx:1,sy:1,face:1,r:19};}
    updFx();return;
  }
  if(MP.active&&MP.count>0){MP.count--;updFx();return}
  // steer
  let ax=0;
  if(keys.arrowleft||keys[ST.kl])ax=-1;
  if(keys.arrowright||keys[ST.kr])ax=1;
  if(holdDir)P.vx+=holdDir*.8;
  else if(ptr!==null){P.vx+=Math.max(-1,Math.min(1,(ptr-P.x)/30))*.9}
  else P.vx+=ax*.8;
  P.vx*=.86;
  if(Math.abs(P.vx)>.3)P.face=Math.sign(P.vx);
  P.x+=P.vx;
  if(P.x<-P.r)P.x=W+P.r;if(P.x>W+P.r)P.x=-P.r;
  P.vy+=.45;P.y+=P.vy;
  const tr=SV.eq.trail;
  if(tr!=="none"&&tr!=="rainbowtail"&&t%2===0)emitTrail(tr);
  if(tr==="rainbowtail"){
    const q=trailHist[trailHist.length-1];if(q&&Math.abs(P.x-q.x)>W/2)trailHist.length=0;
    trailHist.push({x:P.x,y:P.y});if(trailHist.length>24)trailHist.shift();
    if(ST.fx&&t%3===0)parts.push({x:P.x+(Math.random()-.5)*26,y:P.y+8+Math.random()*30,vx:0,vy:.5,g:0,l:.6,col:"#fff",sh:"star",r:4});
  }else if(trailHist.length)trailHist.length=0;
  if(ST.fx)hatFx(SV.eq.hat);
  if(ST.fx&&SV.eq.hat==="legend"&&t%3===0)parts.push({x:P.x+(Math.random()-.5)*34,y:P.y-30*P.sy+(Math.random()-.5)*14,vx:(Math.random()-.5)*.6,vy:-.4,g:0,l:.7,col:Math.random()<.5?"#fff6a8":"#ffd23f",sh:"star",r:5});
  P.sx+=(1-P.sx)*.18;P.sy+=(1-P.sy)*.18;
  if(P.vy>0)P.sy=Math.min(1.25,1+P.vy*.015),P.sx=1/P.sy;

  // platforms
  plats.forEach(p=>{
    if(p.type==="m"){p.x+=p.vx;if(p.x<0||p.x+p.w>W)p.vx*=-1}
    if(p.dead){p.fall=(p.fall||0)+1;p.y+=p.fall*.6}
    if(P.vy>0&&!p.dead&&P.y+P.r>p.y&&P.y+P.r<p.y+p.h+P.vy+2&&P.x>p.x-8&&P.x<p.x+p.w+8){
      P.y=p.y-P.r;
      if(p.type==="s"){P.vy=-19;shake=6;beep(380,.25,"sine",.1,500);burst(P.x,p.y,"#ff6b8b",14);pop(P.x,p.y-30,"BOING!","#ff6b8b")}
      else{P.vy=-11.2;beep(260,.1,"square",.04,200)}
      if(p.type==="b"){p.dead=true;burst(p.x+p.w/2,p.y,"#b5835a",12)}
      P.sx=1.4;P.sy=.6;burst(P.x,p.y,"#fff",5,2);if(SV.eq.hat==="legend")burst(P.x,p.y-20,"#ffd23f",7,3);
    }
  });
  // coins
  coins.forEach(k=>{
    if(!k.got&&Math.hypot(k.x-P.x,k.y-P.y)<P.r+14){
      k.got=true;combo++;comboT=110;coinsTotal++;
      const pts=10*combo;bonus+=pts;
      pop(k.x,k.y-10,"+"+pts+(combo>1?" x"+combo:""),"#ffd23f");
      burst(k.x,k.y,"#ffd23f",10);beep(700+combo*60,.12,"triangle",.07,300);
    }
  });
  if(comboT>0&&--comboT===0)combo=0;
  // camera
  if(P.y<H*.4){
    const d=H*.4-P.y;P.y=H*.4;maxH+=d;score=maxH/10;
    const hm2=Math.floor(maxH/10);if(!godOn()&&hm2>(SV.bestH||0)){SV.bestH=hm2;bestHDirty=true}
    plats.forEach(p=>p.y+=d);coins.forEach(k=>k.y+=d);topY+=d;
    parts.forEach(q=>q.y+=d);pops.forEach(q=>q.y+=d);trailHist.forEach(q=>q.y+=d);
    clouds.forEach(cl=>{cl.y+=d*.3*cl.s;if(cl.y>H+40){cl.y=-40;cl.x=Math.random()*W}});
    genPlats();
  }
  plats=plats.filter(p=>p.y<H+60);coins=coins.filter(k=>k.y<H+60&&!k.got);
  if(P.y>H+40){if(godOn()){P.y=H-60;P.vy=-14;P.sx=1.4;P.sy=.6}else gameOver()}
  if(MP.active&&state==="play")mpTick();
  if(bestHDirty&&t%300===0){bestHDirty=false;save()}
  updFx();
}
function updFx(){
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=(q.g===undefined?.2:q.g);q.l-=.03});parts=parts.filter(q=>q.l>0);
  pops.forEach(q=>{q.y-=1;q.l-=.018});pops=pops.filter(q=>q.l>0);
  if(shake>0)shake*=.85;
}

// ---------- Draw helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function outline(fill){ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.stroke()}
function skyColor(mh=maxH){
  const h=Math.max(0,Math.min(1,mh/12000));
  const a=[[143,227,255],[255,160,122],[90,60,160]],i=h<.5?0:1,f=h<.5?h*2:(h-.5)*2;
  const m=a[i].map((v,k)=>Math.round(v+(a[i+1][k]-v)*f));
  return `rgb(${m})`;
}
function cloud(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.arc(26,-8,28,0,7);ctx.arc(54,2,20,0,7);ctx.rect(0,0,54,22);
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();ctx.restore();
}
function drawPadSkin(p,k){
  const x=p.x,y=p.y,w=p.w,h=p.h,m=y+h/2;
  if(k==="log"){
    rr(x,y,w,h,7);outline("#a0693a");
    ctx.strokeStyle="#7a4a24";ctx.lineWidth=2;
    for(let i=12;i<w-14;i+=14){ctx.beginPath();ctx.moveTo(x+i,y+4);ctx.lineTo(x+i+3,y+h-4);ctx.stroke()}
    ctx.beginPath();ctx.ellipse(x+w-6,m,4,6,0,0,7);outline("#e0b27a");
    ctx.beginPath();ctx.arc(x+w-6,m,1.6,0,7);ctx.fillStyle="#a0693a";ctx.fill();
  }else if(k==="baguette"){
    rr(x,y,w,h,8);outline("#e0a85a");
    ctx.fillStyle="rgba(120,70,20,.28)";rr(x+5,y+h-5,w-10,3,2);ctx.fill();
    ctx.strokeStyle="#fff1c9";ctx.lineWidth=3;ctx.lineCap="round";
    const n=Math.max(2,Math.floor(w/20)),st=(w-24)/n;
    for(let i=0;i<=n;i++){const cx=x+12+i*st;ctx.beginPath();ctx.moveTo(cx-3,y+11);ctx.lineTo(cx+3,y+4);ctx.stroke()}
    ctx.lineCap="butt";
  }else if(k==="cloud"){
    const bs=[[w*.25,y+5,5.5],[w*.5,y+3,7],[w*.75,y+5,5.5]];
    ctx.lineWidth=6;ctx.strokeStyle=INK;
    bs.forEach(([bx,by,r])=>{ctx.beginPath();ctx.arc(x+bx,by,r,0,7);ctx.stroke()});
    rr(x,y+4,w,h-4,6);ctx.stroke();
    ctx.fillStyle="#fff";bs.forEach(([bx,by,r])=>{ctx.beginPath();ctx.arc(x+bx,by,r,0,7);ctx.fill()});
    rr(x,y+4,w,h-4,6);ctx.fill();
    ctx.fillStyle="#cfe3ff";rr(x+4,y+h-5,w-8,3,2);ctx.fill();
  }else if(k==="snake"){
    rr(x,y+1,w-8,h-2,7);outline("#6bd96b");
    ctx.fillStyle="#3fae4a";
    for(let i=x+8;i<x+w-22;i+=12){ctx.beginPath();ctx.moveTo(i,m);ctx.lineTo(i+5,y+4);ctx.lineTo(i+10,m);ctx.lineTo(i+5,y+h-4);ctx.closePath();ctx.fill()}
    ctx.beginPath();ctx.ellipse(x+w-8,m,9,7.5,0,0,7);outline("#7ee87e");
    ctx.beginPath();ctx.arc(x+w-7,y+5.5,3,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=INK;ctx.stroke();
    ctx.beginPath();ctx.arc(x+w-6,y+5.5,1.3,0,7);ctx.fillStyle=INK;ctx.fill();
    if(Math.floor(t/14)%2===0){ctx.strokeStyle="#ff4d6d";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w+.5,m+1);ctx.lineTo(x+w+6,m+1);ctx.moveTo(x+w+6,m+1);ctx.lineTo(x+w+9,m-2);ctx.moveTo(x+w+6,m+1);ctx.lineTo(x+w+9,m+4);ctx.stroke()}
  }else if(k==="ice"){
    rr(x,y,w,h,6);outline("#cfeeff");
    ctx.fillStyle="#9fd0ee";rr(x+4,y+h-5,w-8,3,2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;
    for(let i=10;i<w-12;i+=22){ctx.beginPath();ctx.moveTo(x+i,y+h-5);ctx.lineTo(x+i+6,y+4);ctx.stroke()}
    if(((t+Math.floor(x))%90)<8){ctx.beginPath();starPath(x+w*.7,y+4,4);ctx.fillStyle="#fff";ctx.fill()}
  }else if(k==="candy"){
    ctx.save();rr(x,y,w,h,8);ctx.clip();ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h);
    for(let sx=x-16;sx<x+w+16;sx+=16){ctx.beginPath();ctx.moveTo(sx,y+h);ctx.lineTo(sx+8,y+h);ctx.lineTo(sx+8+h,y);ctx.lineTo(sx+h,y);ctx.closePath();ctx.fillStyle="#ff4d6d";ctx.fill()}
    ctx.restore();rr(x,y,w,h,8);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  }else if(k==="hotdog"){
    rr(x,y,w,h,8);outline("#e8b86a");
    rr(x+4,y+2,w-8,10,5);outline("#d9534f");
    ctx.strokeStyle="#ffd23f";ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.beginPath();
    let up=true;ctx.moveTo(x+9,y+7);
    for(let i=x+9;i<x+w-9;i+=7){ctx.lineTo(i+3.5,up?y+4:y+10);up=!up}
    ctx.stroke();
  }else if(k==="sushi"){
    rr(x,y+4,w,h-4,6);outline("#fff");
    rr(x+2,y,w-4,9,5);outline("#ff8a65");
    ctx.strokeStyle="#ffd0c2";ctx.lineWidth=2;
    for(let i=10;i<w-12;i+=14){ctx.beginPath();ctx.moveTo(x+i,y+2);ctx.lineTo(x+i+5,y+7);ctx.stroke()}
    rr(x+w/2-5,y-1,10,h+2,2);ctx.fillStyle="#2f3d2a";ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
  }else if(k==="rainbow"){
    ctx.save();rr(x,y,w,h,8);ctx.clip();
    for(let i=0;i<5;i++){ctx.fillStyle=`hsl(${(t*3+i*45)%360},90%,60%)`;ctx.fillRect(x,y+i*h/5,w,h/5+1)}
    ctx.restore();rr(x,y,w,h,8);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  }
  if(p.type==="m"){
    ctx.fillStyle="rgba(43,33,64,.8)";
    ctx.beginPath();ctx.moveTo(x+12,y+4);ctx.lineTo(x+6,m);ctx.lineTo(x+12,y+h-4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+w-22,y+4);ctx.lineTo(x+w-16,m);ctx.lineTo(x+w-22,y+h-4);ctx.closePath();ctx.fill();
  }
  if(p.type==="b"){
    ctx.fillStyle="rgba(120,80,40,.25)";rr(x,y,w,h,8);ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.4,y);ctx.lineTo(x+w*.46,y+6);ctx.lineTo(x+w*.38,y+10);ctx.lineTo(x+w*.5,y+h);ctx.stroke();
  }
  if(p.type==="s"){
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<4;i++){ctx.moveTo(x+w/2-10,y-i*4);ctx.lineTo(x+w/2+10,y-i*4-2)}
    ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y-17,3,0,7);outline("#ff6b8b");
  }
}
function drawPlat(p,sk){
  const pk=sk||SV.eq.pad||"none";if(pk!=="none"){drawPadSkin(p,pk);return}
  const cols={n:"#6bd96b",m:"#5bb8ff",b:"#c8925f",s:"#ff6b8b"};
  rr(p.x,p.y,p.w,p.h,8);outline(cols[p.type]);
  ctx.fillStyle="rgba(255,255,255,.4)";rr(p.x+6,p.y+3,p.w-12,3,2);ctx.fill();
  if(p.type==="s"){ // spring coil
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<4;i++){ctx.moveTo(p.x+p.w/2-10,p.y-i*4);ctx.lineTo(p.x+p.w/2+10,p.y-i*4-2)}ctx.stroke();
  }

const MP={sent:new Set(),sentAt:{},code:null,room:null,unsub:null,active:false,round:null,joined:false,ghosts:{},msg:"",msgT:0,count:0,sendT:0};
let joinOpen=false;
const toast=m=>{MP.msg=m;MP.msgT=160};
const uid=()=>window.FB.user.uid;
const mpOK=()=>!!(window.MPB&&window.FB&&window.FB.user);
function mpWhy(){return !window.MPB?"Multiplayer ist nicht eingerichtet (Realtime Database).":"Bitte erst einloggen (LOG IN)."}
const VER=15;
let lobbyFlag=null;
function lobbySync(){
  if(!MP.code||!MP.joined||!window.MPB||!window.FB||!window.FB.user)return;
  const want=state==="lobby";
  if(lobbyFlag===want)return;
  lobbyFlag=want;

}
const myInfo=slot=>({name:SV.name||"Spieler",col:SV.eq.col,hat:SV.eq.hat,ready:false,alive:false,score:0,slot,v:VER,inLobby:true});
function genCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];return c}
async function createRoom(){
  if(!mpOK()){toast(mpWhy());return}
  try{
    let code,tries=0;
    do{code=genCode();tries++}while(tries<6&&await window.MPB.get("rooms/"+code));
    await window.MPB.set("rooms/"+code,{created:Date.now(),state:"lobby",round:0,seed:0,players:{[uid()]:myInfo(0)}});
    enterRoom(code);
  }catch(e){console.error(e);toast("Fehler: "+(e.code||e.message))}
}
async function joinRoom(code){
  code=code.trim().toUpperCase();
  if(code.length<5)return "Bitte 5 Zeichen eingeben.";
  try{
    const r=await window.MPB.get("rooms/"+code);
    if(!r)return "Raum nicht gefunden.";
    const ps=r.players||{};
    if(!ps[uid()]){
      if(r.state!=="lobby")return "In diesem Raum läuft gerade eine Runde.";
      const used=Object.values(ps).map(p=>p.slot);
      if(used.length>=4)return "Der Raum ist voll.";
      let slot=0;while(used.includes(slot))slot++;
      await window.MPB.set("rooms/"+code+"/players/"+uid(),myInfo(slot));
    }
    enterRoom(code);return "";
  }catch(e){console.error(e);return "Fehler: "+(e.code||e.message)}
}
function enterRoom(code){
  MP.code=code;MP.round=null;MP.joined=false;MP.room=null;MP.ghosts={};MP.prevState=null;MP.played=0;MP.resRound=0;lobbyFlag=null;
  try{window.MPB.dc("rooms/"+code+"/players/"+uid());window.MPB.dc("rooms/"+code+"/pos/"+uid())}catch(e){}
  MP.unsub=window.MPB.watch("rooms/"+code,onRoom);

function mpReset(msg){

    try{
      const others=r&&r.players?Object.keys(r.players).filter(i=>i!==uid()):[];
      if(!others.length)await window.MPB.remove("rooms/"+code);
      else await window.MPB.update("rooms/"+code,{["players/"+uid()]:null,["pos/"+uid()]:null});
    }catch(e){}
  }

function onRoom(r){
  if(!MP.code)return;
  const me=window.FB&&window.FB.user?uid():null;
  if(!r||!r.players||!me||!r.players[me]){if(MP.joined)mpReset("Raum wurde geschlossen.");return}
  MP.joined=true;MP.room=r;

  MP.prevState=r.state;
  if(r.state==="lobby"&&MP.played&&MP.played===r.round&&MP.resRound!==r.round&&(state==="lobby"||state==="spectate")){
    MP.resRound=r.round;MP.resT=t;MP.resPos={};MP.resSw={};MP.resDone=false;state="results";beep(880,.2,"triangle");
  }
  if(MP.round===null)MP.round=r.round||0;
  const ps=r.players,ids=Object.keys(ps).sort((a,b)=>ps[a].slot-ps[b].slot);
  if(r.state==="playing"&&r.round!==MP.round&&!MP.active)startMP(r);
  if(ids[0]===me){
    if(r.state==="lobby"&&ids.length>=2&&ids.every(i=>ps[i].ready&&ps[i].inLobby!==false)){
      const u={state:"playing",seed:(Math.random()*1e9)|0,round:(r.round||0)+1};

    }
  }

const pingpong=(v,max)=>{const m=((v%(2*max))+2*max)%(2*max);return m>max?2*max-m:m};
function specWorld(seed){
  const R=mulberry32(seed||1);
  return{list:[{x:W/2-50,x0:W/2-50,alt:0,w:100,type:"n",vx:0}],alt:0,gen(upto){
    while(this.alt<upto){
      const diff=Math.min(1,this.alt/9000),gap=48+diff*60+R()*30;
      this.alt+=gap;
      const pw=Math.max(54,86-diff*30),x=R()*(W-pw),r=R();let type="n";
      if(r<.18+diff*.15)type="m";else if(r<.30+diff*.2)type="b";else if(r<.38+diff*.05)type="s";
      const vx=type==="m"?(R()<.5?-1:1)*(1+diff*1.5):0;
      if(R()<.45&&type!=="s")R();
      this.list.push({x,x0:x,alt:this.alt,w:pw,type,vx});
    }
  }};
}
function specIds(){

    if(res.body&&res.body.getReader){
      const rd=res.body.getReader(),dec=new TextDecoder();
      for(let n=0;n<40;n++){const r=await rd.read();if(r.done)break;txt+=dec.decode(r.value,{stream:true});if(re.test(txt)){rd.cancel().catch(()=>{});break}}
    }else txt=await res.text();
    const m=txt.match(re);
    if(m){const latest=+m[1];if(latest>VER)showUpdate(latest);else if(updOpen)hideUpdate()}
  }catch(e){}finally{updBusy=false}
}

  try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}

const STEP=1000/60;
let lastT=performance.now(),acc=0,fpsN=0,fpsT=performance.now(),fpsV=0,lastR=0;
function loop(now){
  now=now||performance.now();
  if(ST.cap>0){
    const iv=1000/ST.cap,el=now-lastR;
    if(el<iv-1.5){requestAnimationFrame(loop);return}
    lastR=el>iv*2?now:lastR+iv;
  }else lastR=now;
  let dt=now-lastT;lastT=now;
  if(dt>250||dt<0)dt=STEP;
  frameDt=Math.min(4,dt/STEP);
  fpsN++;if(now-fpsT>=500){fpsV=Math.round(fpsN*1000/(now-fpsT));fpsN=0;fpsT=now}
  acc+=dt;
  let n=0;
  if(updOpen)acc=0;
  while(!updOpen&&acc>=STEP-2&&n<6){update();acc-=STEP;n++}
  if(n>=6)acc=0;
  draw();
  if(state==="shop")drawShop();if(state==="settings")drawSettings();if(state==="mp")drawMP();if(state==="board")drawBoard();if(state==="friends")drawFriends();if(state==="results")drawResults();if(state==="spectate")drawSpectate();if(state==="lobby")drawLobby();
  drawInvite();
  lobbySync();
  if(ST.fps)text(fpsV+" FPS",W-8,H-8,12,"#fff","right");
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
