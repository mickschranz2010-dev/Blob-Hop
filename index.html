<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blobbo Hop</title>
<style>
:root{--bg:rgb(57,44,100);--ink:#2b2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgb(57,44,100)}}
:root[data-theme="dark"]{--bg:rgb(57,44,100)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Bangers","Comic Sans MS","Chalkboard SE",cursive,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{border:5px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#8fe3ff;max-width:100%;max-height:100%}
:root{--card:#fffdf2;--txt:#2b2140}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#4a3b7a;--txt:#fff}}
:root[data-theme="dark"]{--card:#4a3b7a;--txt:#fff}
#adm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#adm[hidden]{display:none}
#adm .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#adm h2{margin:0 0 10px;font-size:30px;font-weight:400}
#adm button,#adm input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#adm input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#adm button.red{background:#ff6b8b}#adm button.blue{background:#5bb8ff}
#adm p{margin:6px 0;min-height:1.2em}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#auth[hidden]{display:none}
#auth .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#auth h2{margin:0 0 10px;font-size:30px;font-weight:400}
#auth button,#auth input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#auth input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#auth button.red{background:#ff6b8b}#auth button.blue{background:#5bb8ff}
#auth p{margin:6px 0;min-height:1.2em}
#auth input{width:100%;box-sizing:border-box}
#auth .idc{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,#fff6d6 0 12px,#fff0bd 12px 24px);color:#2b2140;box-shadow:0 4px 0 var(--ink);margin-bottom:8px}
#auth .idh{background:#ff6b8b;color:#fff;font-size:22px;letter-spacing:2px;padding:4px 10px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 #2b2140;display:flex;justify-content:space-between}
#auth .idb{display:flex;gap:12px;padding:12px}
#auth #avatar{width:96px;height:96px;border:4px solid var(--ink);border-radius:14px;transform:rotate(-3deg);flex:none;background:#8fe3ff}
#auth .idi{min-width:0;flex:1}
#auth .lbl{font-size:12px;letter-spacing:1px;color:#8a7ba8;margin-top:4px}
#auth .nm{font-size:26px;display:flex;align-items:center;gap:4px;line-height:1.1}
#auth .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#auth .nm button,#auth .nb button{padding:1px 6px;font-size:16px;margin:0}
#auth .nb{display:flex;gap:4px}
#auth .nb input{min-width:0;font-size:18px;padding:3px 6px;margin:0}
#auth .sm{font-size:13px;overflow:hidden;text-overflow:ellipsis}
#auth .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 10px}
#auth .stats div{background:#fff;border:3px solid var(--ink);border-radius:10px;text-align:center;padding:3px 2px}
#auth .stats b{display:block;font-size:22px;font-weight:400}
#auth .stats span{font-size:11px;color:#8a7ba8}
#auth .idf{display:flex;align-items:center;gap:8px;border-top:3px dashed var(--ink);padding:6px 12px;font-size:13px}
#auth .bar{flex:1;height:18px;background:repeating-linear-gradient(90deg,#2b2140 0 2px,transparent 2px 5px,#2b2140 5px 9px,transparent 9px 11px)}
#auth .nm button{display:flex;align-items:center}
#nameDlg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.6)}
#nameDlg[hidden]{display:none}
#nameDlg .dlg{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(80vw,280px)}
#nameDlg h3{margin:0 0 8px;font-size:26px;font-weight:400}
#nameDlg input,#nameDlg button{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#fff;color:#2b2140;width:100%;box-sizing:border-box}
#nameDlg button{width:auto;cursor:pointer;background:#ffd23f}
#nameDlg button.blue{background:#5bb8ff}#nameDlg button.red{background:#ff6b8b}
#nameDlg p{margin:4px 0;min-height:1.2em;color:#ff6b8b}
#joinDlg{position:fixed;z-index:9;touch-action:auto;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.6)}
#joinDlg[hidden]{display:none}
#joinDlg .dlg{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(80vw,280px)}
#joinDlg h3{margin:0 0 8px;font-size:26px;font-weight:400}
#joinDlg input,#joinDlg button{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#fff;color:#2b2140;width:100%;box-sizing:border-box}
#joinDlg button{width:auto;cursor:pointer;background:#ffd23f}
#joinDlg button.blue{background:#5bb8ff}#joinDlg button.red{background:#ff6b8b}
#joinDlg p{margin:4px 0;min-height:1.2em;color:#ff6b8b}
#joinDlg input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:26px}
</style>
</head>
<body>
<canvas id="c" aria-label="Blobbo Hop Spiel"></canvas>
<div id="auth" hidden><div class="box">
<h2>Account</h2>
<div id="aOut"><input id="aName" maxlength="14" autocomplete="nickname" placeholder="Spielername (zum Registrieren)"><input id="aMail" type="email" autocomplete="email" placeholder="E-Mail"><input id="aPw" type="password" autocomplete="current-password" placeholder="Passwort (min. 6 Zeichen)"><button id="aLogin" class="blue">Einloggen</button><button id="aReg">Registrieren</button></div>
<div id="aIn" hidden>
<div class="idc">
 <div class="idh"><span>BLOBBO-AUSWEIS</span><span>★</span></div>
 <div class="idb">
  <canvas id="avatar" width="120" height="120"></canvas>
  <div class="idi">
   <div class="lbl">NAME</div>
   <div class="nm"><span id="nameTxt"></span><button id="nameEdit" title="Name ändern" aria-label="Name ändern"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4.5 15.5L16 4l4 4L8.5 19.5z" fill="#fff" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="#2b2140" stroke-width="2"/><path d="M3 21l1.5-5.5 4 4z" fill="#ff6b8b" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
   <div class="lbl">E-MAIL</div><div class="sm" id="aMail2"></div>
  </div>
 </div>
 <div class="stats"><div><b id="stCoins">0</b><span>Münzen</span></div><div><b id="stTotal">0</b><span>Gesamt</span></div><div><b id="stBest">0</b><span>Highscore</span></div></div>
 <div class="idf"><span>ID <span id="idNo"></span></span><div class="bar"></div></div>
</div>
<button id="aSave" class="blue">Jetzt speichern</button><button id="aLogout" class="red">Ausloggen</button></div>
<p id="aMsg"></p><button id="aClose" class="red">Schließen</button>
</div>
<div id="nameDlg" hidden><div class="dlg">
<h3>Neuer Name</h3>
<input id="nameIn" maxlength="14" placeholder="Dein Name">
<p id="nameErr"></p>
<button id="nameOk" class="blue">Speichern</button><button id="nameNo" class="red">Abbrechen</button>
</div></div>
</div>
<div id="joinDlg" hidden><div class="dlg">
<h3>Raum beitreten</h3>
<input id="joinIn" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off">
<p id="joinErr"></p>
<button id="joinOk" class="blue">Beitreten</button><button id="joinNo" class="red">Abbrechen</button>
</div></div>
<div id="adm" hidden><div class="box">
<h2>Admin-Panel</h2>
<div id="lock"><p id="pinInfo"></p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button id="pinGo">OK</button></div>
<div id="tools" hidden>
<p id="stat"></p>
<button data-c="100">+100</button><button data-c="1000">+1.000</button><button data-c="10000">+10.000</button>
<div><input id="setN" type="number" min="0" placeholder="Münzen"><button id="setGo" class="blue">Setzen</button></div>
<div><button id="unlock" class="blue">Alles freischalten</button><button id="god" class="blue">Gott-Modus: aus</button></div>
<div><input id="newPin" type="password" inputmode="numeric" placeholder="Neuer PIN"><button id="pinSet" class="blue">PIN ändern</button></div>
<div><button id="wipe" class="red">Fortschritt löschen</button></div>
</div>
<p id="msg2"></p>
<button id="admClose" class="red">Schließen</button>
</div></div>
<script>
(()=>{
const W=400,H=640,INK="#2b2140";
const c=document.getElementById("c");let ctx=c.getContext("2d");
c.width=W*2;c.height=H*2;ctx.scale(2,2);
function fit(){const pad=24,s=Math.min((innerWidth-pad)/W,(innerHeight-pad-12)/H);c.style.width=W*s+"px";c.style.height=H*s+"px"}
addEventListener("resize",fit);fit();

// ---------- Einstellungen ----------
let ST={sound:true,vol:1,shake:true,fx:true,kl:"a",kr:"d"};
try{Object.assign(ST,JSON.parse(localStorage.getItem("blobbo-set")))}catch(e){}
function saveST(){try{localStorage.setItem("blobbo-set",JSON.stringify(ST))}catch(e){}}
// ---------- Audio ----------
let AC=null;
function beep(f,d=.12,type="square",v=.06,slide=0){
  if(!ST.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
    g.gain.value=v*[.4,1,1.8][ST.vol];g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- State ----------
let best=0;
try{best=+localStorage.getItem("blobbo-best")||0}catch(e){}
let state="menu",score=0,bonus=0,combo=0,comboT=0,shake=0,t=0,coinsTotal=0;
let P,plats,coins,parts,pops,clouds,topY,maxH,genAlt=0,rnd=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let z=Math.imul(a^a>>>15,1|a);z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296}}
const keys={};let ptr=null,rel=null,holdDir=0;
// ---------- Shop-Daten ----------
const ITEMS={
 col:[{id:"orange",n:"Orange",p:0,v:"#ff8c42"},{id:"mint",n:"Minze",p:30,v:"#4fd6a4"},{id:"pink",n:"Bubblegum",p:40,v:"#ff7eb6"},{id:"blue",n:"Wolke",p:50,v:"#5bb8ff"},{id:"red",n:"Tomate",p:60,v:"#ff5b5b"},{id:"lime",n:"Limette",p:70,v:"#b8e84a"},{id:"purple",n:"Traube",p:80,v:"#a77bff"},{id:"teal",n:"Lagune",p:90,v:"#2ec4b6"},{id:"night",n:"Schatten",p:110,v:"#6b5b95"},{id:"gold",n:"Gold",p:150,v:"#ffd23f"},{id:"ice",n:"Eiskristall",p:250,v:"#aef3ff"},{id:"rainbow",n:"Regenbogen",p:500,v:"rainbow"}],
 hat:[{id:"none",n:"Kein Hut",p:0},{id:"cap",n:"Kappe",p:40},{id:"flower",n:"Blume",p:50},{id:"party",n:"Partyhut",p:60},{id:"chef",n:"Kochmütze",p:70},{id:"top",n:"Zylinder",p:80},{id:"cowboy",n:"Cowboyhut",p:90},{id:"horns",n:"Teufelshörner",p:100},{id:"wizard",n:"Zauberhut",p:110},{id:"halo",n:"Heiligenschein",p:120},{id:"bunny",n:"Hasenohren",p:140},{id:"crown",n:"Krone",p:200},{id:"legend",n:"Sternenkrone",p:2000}],
 trail:[{id:"none",n:"Keine Spur",p:0},{id:"bubble",n:"Blasen",p:40},{id:"leaf",n:"Blätter",p:50},{id:"spark",n:"Funken",p:60},{id:"heart",n:"Herzen",p:90},{id:"rainbow",n:"Regenbogen",p:120},{id:"fire",n:"Feuer",p:150},{id:"star",n:"Sterne",p:180},{id:"galaxy",n:"Galaxie",p:300}]
};

let SV={coins:0,own:["col:orange","hat:none","trail:none"],eq:{col:"orange",hat:"none",trail:"none"}};
try{const o=JSON.parse(localStorage.getItem("blobbo-save"));if(o&&o.own&&o.eq)SV=o}catch(e){}
function save(){try{localStorage.setItem("blobbo-save",JSON.stringify(SV))}catch(e){}cloudSave()}
function cloudSave(){const F=window.FB;if(F&&F.user){if(F.pushBoard)F.pushBoard({name:SV.name||"Spieler",best,total:Math.max(SV.total||0,SV.coins),col:SV.eq.col,hat:SV.eq.hat}).catch(()=>{});F.save({name:SV.name||"Spieler",total:SV.total||0,coins:SV.coins,own:SV.own,eq:SV.eq,best}).catch(()=>{})}}
const MB={x:120,y:432,w:160,h:44},AB={x:120,y:484,w:160,h:44},GB={x:120,y:536,w:160,h:44};
function acctBtn(){btn(AB.x,AB.y,AB.w,AB.h,(window.FB&&window.FB.user)?"ACCOUNT":"LOG IN","#5bb8ff");btn(GB.x,GB.y,GB.w,GB.h,"SETTINGS","#a77bff");btn(MB.x,MB.y,MB.w,MB.h,"MULTIPLAYER","#6bd96b")}
const CH={x:10,y:10,w:158,h:48};
function pencil(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(.8);rr(-3,-10,6,15,1);outline("#ffd23f");ctx.beginPath();ctx.moveTo(-3,5);ctx.lineTo(3,5);ctx.lineTo(0,11);ctx.closePath();outline("#ffe9a8");ctx.restore()}
function chip(){
  const u=window.FB&&window.FB.user,nm=u?(SV.name||"Spieler"):"Gast";
  rr(CH.x,CH.y,CH.w,CH.h,16);outline("#fffdf2");
  ctx.save();ctx.beginPath();ctx.arc(36,34,19,0,7);ctx.clip();
  ctx.fillStyle="#8fe3ff";ctx.fillRect(10,10,52,48);
  preview(36,27.4,colV(SV.eq.col),SV.eq.hat,.65);
  ctx.restore();
  ctx.beginPath();ctx.arc(36,34,19,0,7);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  text(nm.length>9?nm.slice(0,8)+"…":nm,62,40,18,"#fff","left");
  if(u)pencil(152,34);
  lbBtn();
}
function colV(id){return ITEMS.col.find(i=>i.id===id).v}
let ovr=null,tab="col",msg="",msgT=0,gain=0,shopScroll=0,sd=null;
const SB={x:120,y:380,w:160,h:44};
function hit(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function starPath(x,y,r){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r)}
function heartPath(x,y,r){ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.7,y-r*1.4,x,y-r*.5);ctx.bezierCurveTo(x+r*.7,y-r*1.4,x+r*1.6,y-r*.2,x,y+r*.9)}
function drawHat2(h){
  if(h==="flower"){for(let k=0;k<5;k++){const a=k*1.2566;ctx.beginPath();ctx.arc(Math.cos(a)*7,-25+Math.sin(a)*7,5,0,7);outline("#ff7eb6")}ctx.beginPath();ctx.arc(0,-25,4.5,0,7);outline("#ffd23f");return true}
  if(h==="chef"){[[-9,-31,9],[0,-37,10],[9,-31,9]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);outline("#fff")});rr(-13,-25,26,10,3);outline("#fff");return true}
  if(h==="cowboy"){ctx.beginPath();ctx.ellipse(0,-17,25,6,0,0,7);outline("#a0693a");rr(-11,-35,22,20,7);outline("#b87c46");rr(-11,-24,22,5,0);ctx.fillStyle="#6b3f1d";ctx.fill();return true}
  if(h==="horns"){[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*14,-14);ctx.quadraticCurveTo(d*21,-24,d*12,-35);ctx.quadraticCurveTo(d*11,-24,d*6,-17);ctx.closePath();outline("#ff4d4d")});return true}
  if(h==="wizard"){ctx.beginPath();ctx.ellipse(0,-15,23,5,0,0,7);outline("#4b32a8");ctx.beginPath();ctx.moveTo(-15,-15);ctx.lineTo(4,-52);ctx.lineTo(15,-15);ctx.closePath();outline("#6b4cd6");ctx.fillStyle="#ffd23f";[[0,-30],[-5,-22],[6,-38]].forEach(([x,y])=>{ctx.beginPath();starPath(x,y,3.5);ctx.fill()});return true}
  if(h==="bunny"){const w=Math.sin(t*.1)*.12;[-1,1].forEach(d=>{ctx.save();ctx.translate(d*8,-18);ctx.rotate(d*.25+w*d);ctx.beginPath();ctx.ellipse(0,-12,5,14,0,0,7);outline("#fff");ctx.beginPath();ctx.ellipse(0,-12,2.3,9,0,0,7);ctx.fillStyle="#ff9ec4";ctx.fill();ctx.restore()});return true}
  if(h==="legend"){
    ctx.save();ctx.translate(0,Math.sin(t*.1)*1.5);
    const g=ctx.createRadialGradient(0,-26,4,0,-26,40),a=.45+Math.sin(t*.12)*.15;
    g.addColorStop(0,`rgba(255,236,140,${a})`);g.addColorStop(1,"rgba(255,236,140,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-26,40,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-17,-14);ctx.lineTo(-19,-38);ctx.lineTo(-9,-27);ctx.lineTo(0,-44);ctx.lineTo(9,-27);ctx.lineTo(19,-38);ctx.lineTo(17,-14);ctx.closePath();
    const cg=ctx.createLinearGradient(-19,-44,19,-14);cg.addColorStop(0,"#ffe066");cg.addColorStop(.5+Math.sin(t*.08)*.35,"#fff8c9");cg.addColorStop(1,"#f2a900");
    outline(cg);
    [[-9,-20,"#ff4d6d"],[0,-22,"#4dd2ff"],[9,-20,"#7cff6b"]].forEach(([x,y,c],k)=>{ctx.beginPath();ctx.arc(x,y,3.2+Math.sin(t*.2+k)*.6,0,7);outline(c)});
    [[-19,-38],[0,-44],[19,-38]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,3,0,7);outline("#fff")});
    for(let k=0;k<3;k++){const a2=t*.06+k*2.094,x=Math.cos(a2)*27,y=-28+Math.sin(a2)*9;ctx.beginPath();starPath(x,y,5+Math.sin(t*.2+k)*1.5);ctx.fillStyle="#fffbd0";ctx.fill()}
    ctx.restore();return true;
  }
  return false;
}
function drawHat(h){
  if(drawHat2(h))return;
  if(h==="cap"){ctx.beginPath();ctx.arc(0,-8,17,Math.PI,0);ctx.closePath();outline("#4a90ff");rr(2,-13,24,7,3);outline("#2f6fd6")}
  else if(h==="party"){ctx.beginPath();ctx.moveTo(-12,-14);ctx.lineTo(0,-44);ctx.lineTo(12,-14);ctx.closePath();outline("#ff6b8b");ctx.beginPath();ctx.arc(0,-45,5,0,7);outline("#ffd23f")}
  else if(h==="top"){rr(-13,-44,26,28,4);outline("#3b3355");rr(-13,-27,26,6,0);ctx.fillStyle="#ff6b8b";ctx.fill();rr(-21,-19,42,7,3);outline("#3b3355")}
  else if(h==="crown"){ctx.beginPath();ctx.moveTo(-14,-14);ctx.lineTo(-15,-32);ctx.lineTo(-7,-23);ctx.lineTo(0,-34);ctx.lineTo(7,-23);ctx.lineTo(15,-32);ctx.lineTo(14,-14);ctx.closePath();outline("#ffd23f")}
  else if(h==="halo"){ctx.beginPath();ctx.ellipse(0,-30+Math.sin(t*.1)*2,14,5,0,0,7);ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle="#ffd23f";ctx.stroke()}
}
function preview(x,y,col,hat,sc=1.1){
  const sp=P;ovr={col,hat};
  P={x,y,vx:0,vy:0,sx:sc,sy:sc,face:1,r:19};drawBlob();P=sp;ovr=null;
}
function closeShop(){shopScroll=0;bindKey=null;reset();state="menu";beep(500,.08,"triangle")}
function shopClick(x,y){
  const tabs=["col","hat","trail"];
  for(let i=0;i<3;i++)if(hit(x,y,{x:20+i*125,y:76,w:115,h:38})){tab=tabs[i];shopScroll=0;beep(600,.05);return}
  if(hit(x,y,{x:120,y:584,w:160,h:40})){closeShop();return}
  if(y<122||y>578)return;
  const sy=y+shopScroll;
  ITEMS[tab].forEach((it,i)=>{
    if(!hit(x,sy,{x:20+(i%2)*190+20,y:130+Math.floor(i/2)*150+98,w:130,h:34}))return;
    const key=tab+":"+it.id;
    if(SV.own.includes(key)){SV.eq[tab]=it.id;save();beep(640,.08,"triangle")}
    else if(SV.coins>=it.p){SV.coins-=it.p;SV.own.push(key);SV.eq[tab]=it.id;save();beep(880,.25,"triangle",.08,400);msg="Gekauft!";msgT=70}
    else{msg="Zu wenig Münzen!";msgT=90;beep(200,.2,"sawtooth")}
  });
}

const SROWS=[["Vollbild","fs"],["Sound","sound"],["Lautstärke","vol"],["Screenshake","shake"],["Effekte","fx"],["Taste Links","kl"],["Taste Rechts","kr"]];
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){
  const d=document,el=d.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  const fail=()=>{msg="Vollbild geht hier leider nicht";msgT=100};
  try{
    if(isFS())Promise.resolve((d.exitFullscreen||d.webkitExitFullscreen).call(d)).catch(fail);
    else if(req)Promise.resolve(req.call(el)).catch(fail);
    else fail();
  }catch(e){fail()}
}
let bindKey=null;

const RY=i=>84+i*60;

  if(hit(x,y,{x:120,y:584,w:160,h:40})){closeShop();return}

function reset(){
  if(!MP.active)rnd=Math.random;
  genAlt=0;
  P={x:W/2,y:H-120,vx:0,vy:-11,sx:1,sy:1,face:1,r:19};
  plats=[];coins=[];parts=[];pops=[];
  plats.push({x:W/2-50,y:H-70,w:100,h:16,type:"n",vx:0});
  topY=H-70;maxH=0;score=0;bonus=0;combo=0;coinsTotal=0;
  genPlats();
  if(!clouds)clouds=Array.from({length:7},(_,i)=>({x:Math.random()*W,y:i*95,s:.6+Math.random()*.9}));
}
function genPlats(){
  while(topY>-120){
    const diff=Math.min(1,genAlt/9000),gap=48+diff*60+rnd()*30;
    topY-=gap;genAlt+=gap;
    const w=Math.max(54,86-diff*30),x=rnd()*(W-w);
    const r=rnd();let type="n";
    if(r<.18+diff*.15)type="m";
    else if(r<.30+diff*.2)type="b";
    else if(r<.38+diff*.05)type="s";
    const p={x,y:topY,w,h:16,type,vx:type==="m"?(rnd()<.5?-1:1)*(1+diff*1.5):0};
    plats.push(p);
    if(rnd()<.45&&type!=="s")coins.push({x:x+w/2,y:topY-34,got:false,ph:rnd()*6});
  }
}
function emitTrail(tr){
  const o={x:P.x+(Math.random()-.5)*12,y:P.y+P.r*.6,vx:(Math.random()-.5),vy:.5,l:.8,col:"#fff",r:4};
  if(tr==="rainbow")o.col=`hsl(${t*8%360},90%,60%)`;
  else if(tr==="spark")o.col="#ffd23f";
  else if(tr==="bubble")o.r=7;
  else if(tr==="leaf"){o.col=Math.random()<.5?"#6bd96b":"#3fae4a";o.vx=(Math.random()-.5)*2;o.vy=-.2;o.g=.05;o.r=5}
  else if(tr==="heart"){o.col="#ff6b8b";o.sh="heart";o.r=6;o.vy=-.6;o.g=0}
  else if(tr==="fire"){o.col=["#ff4d4d","#ff8c42","#ffd23f"][Math.random()*3|0];o.vy=-1.8;o.vx=(Math.random()-.5)*1.2;o.g=-.05;o.r=6;o.l=.6}
  else if(tr==="star"){o.col="#ffd23f";o.sh="star";o.r=6;o.g=.1}
  else if(tr==="galaxy"){o.col=`hsl(${240+Math.random()*80},90%,${60+Math.random()*20}%)`;o.sh=Math.random()<.5?"star":null;o.r=5;o.g=0}
  parts.push(o);
}
function burst(x,y,col,n=10,sp=4){
  if(!ST.fx)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,col,r:3+Math.random()*4})}
}
function pop(x,y,txt,col="#fff"){pops.push({x,y,txt,col,l:1})}

  if(admOpen||authOpen||joinOpen)return;seqBuf=(seqBuf+e.key).slice(-4);if(seqBuf==="2911"){seqBuf="";openAdmin();return}keys[e.key.toLowerCase()]=true;if((state==="shop"||state==="settings"||state==="mp"||state==="board")&&e.key==="Escape")closeShop();if(state==="lobby"&&e.key==="Escape")leaveRoom();if(e.key.toLowerCase()==="s"&&(state==="menu"||state==="over"))state="shop";if(e.key===" "||e.key==="Enter")start();if(e.key.startsWith("Arrow"))e.preventDefault()});

  if(e.pointerType!=="mouse"){holdDir=dirOf(e);ptr=null}else ptr=Math.max(0,Math.min(W,x));

addEventListener("pointermove",e=>{

});
const upF=e=>{if(sd){if(!sd.m&&e.type==="pointerup"){if(sd.b)boardClick(sd.x,sd.y);else shopClick(sd.x,sd.y)}sd=null}ptr=null;holdDir=0};
addEventListener("wheel",e=>{if(state==="shop")shopScroll+=e.deltaY;if(state==="board")boardScroll+=e.deltaY},{passive:true});

function start(){
  if(state==="play"||state==="shop"||state==="settings"||state==="mp"||state==="lobby"||state==="board"||state==="spectate")return;
  if(state==="over"&&t-overAt<40)return;
  reset();state="play";beep(520,.15,"triangle",.08,300);
}
let overAt=0;
function gameOver(){
  state="over";overAt=t;shake=14;beep(300,.5,"sawtooth",.08,-250);
  const total=Math.floor(score+bonus);
  gain=coinsTotal+Math.floor(total/200);SV.coins+=gain;SV.total=(SV.total||0)+gain;if(total>best){best=total;try{localStorage.setItem("blobbo-best",best)}catch(e){}}
  save();
  burst(P.x,H-30,"#ff6b8b",30,7);
  if(MP.active)mpDied(total);
}

// ---------- Update ----------
function update(){
  t++;
  clouds&&clouds.forEach(cl=>{cl.x+=.15*cl.s;if(cl.x>W+80)cl.x=-80});
  if(state!=="play"){
    if(state==="menu"){P=P||{x:W/2,y:H-120,vx:0,vy:-11,sx:1,sy:1,face:1,r:19};}
    updFx();return;
  }
  if(MP.active&&MP.count>0){MP.count--;updFx();return}
  // steer
  let ax=0;
  if(keys.arrowleft||keys[ST.kl])ax=-1;
  if(keys.arrowright||keys[ST.kr])ax=1;
  if(holdDir)P.vx+=holdDir*.8;
  else if(ptr!==null){P.vx+=Math.max(-1,Math.min(1,(ptr-P.x)/30))*.9}
  else P.vx+=ax*.8;
  P.vx*=.86;
  if(Math.abs(P.vx)>.3)P.face=Math.sign(P.vx);
  P.x+=P.vx;
  if(P.x<-P.r)P.x=W+P.r;if(P.x>W+P.r)P.x=-P.r;
  P.vy+=.45;P.y+=P.vy;
  const tr=SV.eq.trail;
  if(tr!=="none"&&t%2===0)emitTrail(tr);
  if(ST.fx&&SV.eq.hat==="legend"&&t%3===0)parts.push({x:P.x+(Math.random()-.5)*34,y:P.y-30*P.sy+(Math.random()-.5)*14,vx:(Math.random()-.5)*.6,vy:-.4,g:0,l:.7,col:Math.random()<.5?"#fff6a8":"#ffd23f",sh:"star",r:5});
  P.sx+=(1-P.sx)*.18;P.sy+=(1-P.sy)*.18;
  if(P.vy>0)P.sy=Math.min(1.25,1+P.vy*.015),P.sx=1/P.sy;

  // platforms
  plats.forEach(p=>{
    if(p.type==="m"){p.x+=p.vx;if(p.x<0||p.x+p.w>W)p.vx*=-1}
    if(p.dead){p.fall=(p.fall||0)+1;p.y+=p.fall*.6}
    if(P.vy>0&&!p.dead&&P.y+P.r>p.y&&P.y+P.r<p.y+p.h+P.vy+2&&P.x>p.x-8&&P.x<p.x+p.w+8){
      P.y=p.y-P.r;
      if(p.type==="s"){P.vy=-19;shake=6;beep(380,.25,"sine",.1,500);burst(P.x,p.y,"#ff6b8b",14);pop(P.x,p.y-30,"BOING!","#ff6b8b")}
      else{P.vy=-11.2;beep(260,.1,"square",.04,200)}
      if(p.type==="b"){p.dead=true;burst(p.x+p.w/2,p.y,"#b5835a",12)}
      P.sx=1.4;P.sy=.6;burst(P.x,p.y,"#fff",5,2);if(SV.eq.hat==="legend")burst(P.x,p.y-20,"#ffd23f",7,3);
    }
  });
  // coins
  coins.forEach(k=>{
    if(!k.got&&Math.hypot(k.x-P.x,k.y-P.y)<P.r+14){
      k.got=true;combo++;comboT=110;coinsTotal++;
      const pts=10*combo;bonus+=pts;
      pop(k.x,k.y-10,"+"+pts+(combo>1?" x"+combo:""),"#ffd23f");
      burst(k.x,k.y,"#ffd23f",10);beep(700+combo*60,.12,"triangle",.07,300);
    }
  });
  if(comboT>0&&--comboT===0)combo=0;
  // camera
  if(P.y<H*.4){
    const d=H*.4-P.y;P.y=H*.4;maxH+=d;score=maxH/10;
    plats.forEach(p=>p.y+=d);coins.forEach(k=>k.y+=d);topY+=d;
    parts.forEach(q=>q.y+=d);pops.forEach(q=>q.y+=d);
    clouds.forEach(cl=>{cl.y+=d*.3*cl.s;if(cl.y>H+40){cl.y=-40;cl.x=Math.random()*W}});
    genPlats();
  }
  plats=plats.filter(p=>p.y<H+60);coins=coins.filter(k=>k.y<H+60&&!k.got);
  if(P.y>H+40){if(god){P.y=H-60;P.vy=-14;P.sx=1.4;P.sy=.6}else gameOver()}
  if(MP.active&&state==="play")mpTick();
  updFx();
}
function updFx(){
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=(q.g===undefined?.2:q.g);q.l-=.03});parts=parts.filter(q=>q.l>0);
  pops.forEach(q=>{q.y-=1;q.l-=.018});pops=pops.filter(q=>q.l>0);
  if(shake>0)shake*=.85;
}

// ---------- Draw helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function outline(fill){ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.stroke()}
function skyColor(mh=maxH){
  const h=Math.max(0,Math.min(1,mh/12000));
  const a=[[143,227,255],[255,160,122],[90,60,160]],i=h<.5?0:1,f=h<.5?h*2:(h-.5)*2;
  const m=a[i].map((v,k)=>Math.round(v+(a[i+1][k]-v)*f));
  return `rgb(${m})`;
}
function cloud(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.arc(26,-8,28,0,7);ctx.arc(54,2,20,0,7);ctx.rect(0,0,54,22);
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();ctx.restore();
}
function drawPlat(p){
  const cols={n:"#6bd96b",m:"#5bb8ff",b:"#c8925f",s:"#ff6b8b"};
  rr(p.x,p.y,p.w,p.h,8);outline(cols[p.type]);
  ctx.fillStyle="rgba(255,255,255,.4)";rr(p.x+6,p.y+3,p.w-12,3,2);ctx.fill();
  if(p.type==="s"){ // spring coil
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<4;i++){ctx.moveTo(p.x+p.w/2-10,p.y-i*4);ctx.lineTo(p.x+p.w/2+10,p.y-i*4-2)}ctx.stroke();
  }
  if(p.type==="b"){ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.4,p.y);ctx.lineTo(p.x+p.w*.5,p.y+p.h);ctx.stroke()}
}
function drawCoin(k){
  const w=Math.abs(Math.cos(t*.06+k.ph))*12+3;
  ctx.beginPath();ctx.ellipse(k.x,k.y+Math.sin(t*.08+k.ph)*3,w,13,0,0,7);outline("#ffd23f");
}
function drawBlob(){
  ctx.save();ctx.translate(P.x,P.y+P.r*(1-P.sy));ctx.scale(P.sx,P.sy);
  const sk=ovr||{col:colV(SV.eq.col),hat:SV.eq.hat};
  ctx.beginPath();ctx.ellipse(0,0,P.r,P.r,0,0,7);outline(sk.col==="rainbow"?`hsl(${t*3%360},85%,62%)`:sk.col);
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(-7,-9,6,4,-.5,0,7);ctx.fill();
  const ex=P.face*3,ey=P.vy<0?-3:0;
  [-7,7].forEach(o=>{
    ctx.beginPath();ctx.arc(o+ex,-3,6,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(o+ex+P.face*2,-3+ey*.5,2.5,0,7);ctx.fillStyle=INK;ctx.fill();
  });
  ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.beginPath();
  if(P.vy<0)ctx.arc(0,6,5,0,Math.PI);else ctx.ellipse(0,9,4,5,0,0,7);
  ctx.stroke();
  drawHat(sk.hat);
  ctx.restore();
}
function text(s,x,y,size,col="#fff",align="center"){
  ctx.font=`${size}px Bangers,"Comic Sans MS","Chalkboard SE",cursive`;ctx.textAlign=align;
  ctx.lineWidth=size/5;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.strokeText(s,x,y);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

// ---------- Draw ----------
function draw(){
  ctx.save();

const MP={code:null,room:null,unsub:null,active:false,round:null,joined:false,ghosts:{},msg:"",msgT:0,count:0,sendT:0};
let joinOpen=false;
const toast=m=>{MP.msg=m;MP.msgT=160};
const uid=()=>window.FB.user.uid;
const mpOK=()=>!!(window.MPB&&window.FB&&window.FB.user);
function mpWhy(){return !window.MPB?"Multiplayer ist nicht eingerichtet (Realtime Database).":"Bitte erst einloggen (LOG IN)."}
const myInfo=slot=>({name:SV.name||"Spieler",col:SV.eq.col,hat:SV.eq.hat,ready:false,alive:false,score:0,slot});
function genCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];return c}
async function createRoom(){
  if(!mpOK()){toast(mpWhy());return}
  try{
    let code,tries=0;
    do{code=genCode();tries++}while(tries<6&&await window.MPB.get("rooms/"+code));
    await window.MPB.set("rooms/"+code,{created:Date.now(),state:"lobby",round:0,seed:0,players:{[uid()]:myInfo(0)}});
    enterRoom(code);
  }catch(e){console.error(e);toast("Fehler: "+(e.code||e.message))}
}
async function joinRoom(code){
  code=code.trim().toUpperCase();
  if(code.length<5)return "Bitte 5 Zeichen eingeben.";
  try{
    const r=await window.MPB.get("rooms/"+code);
    if(!r)return "Raum nicht gefunden.";
    const ps=r.players||{};
    if(!ps[uid()]){
      if(r.state!=="lobby")return "In diesem Raum läuft gerade eine Runde.";
      const used=Object.values(ps).map(p=>p.slot);
      if(used.length>=4)return "Der Raum ist voll.";
      let slot=0;while(used.includes(slot))slot++;
      await window.MPB.set("rooms/"+code+"/players/"+uid(),myInfo(slot));
    }
    enterRoom(code);return "";
  }catch(e){console.error(e);return "Fehler: "+(e.code||e.message)}
}
function enterRoom(code){
  MP.code=code;MP.round=null;MP.joined=false;MP.room=null;MP.ghosts={};
  try{window.MPB.dc("rooms/"+code+"/players/"+uid());window.MPB.dc("rooms/"+code+"/pos/"+uid())}catch(e){}
  MP.unsub=window.MPB.watch("rooms/"+code,onRoom);
  state="lobby";beep(700,.15,"triangle",.08,300);
}
function mpReset(msg){
  if(MP.unsub){try{MP.unsub()}catch(e){}}
  MP.unsub=null;MP.code=null;MP.room=null;MP.active=false;MP.round=null;MP.joined=false;MP.ghosts={};MP.spec=null;
  reset();state="mp";if(msg)toast(msg);
}
async function leaveRoom(){
  const code=MP.code,r=MP.room;
  if(code&&mpOK()){
    try{
      const others=r&&r.players?Object.keys(r.players).filter(i=>i!==uid()):[];
      if(!others.length)await window.MPB.remove("rooms/"+code);
      else await window.MPB.update("rooms/"+code,{["players/"+uid()]:null,["pos/"+uid()]:null});
    }catch(e){}
  }
  mpReset("Raum verlassen.");
}
function onRoom(r){
  if(!MP.code)return;
  const me=window.FB&&window.FB.user?uid():null;
  if(!r||!r.players||!me||!r.players[me]){if(MP.joined)mpReset("Raum wurde geschlossen.");return}
  MP.joined=true;MP.room=r;
  if(state==="spectate"&&r.state!=="playing")specLeave();
  if(MP.round===null)MP.round=r.round||0;
  const ps=r.players,ids=Object.keys(ps).sort((a,b)=>ps[a].slot-ps[b].slot);
  if(r.state==="playing"&&r.round!==MP.round&&!MP.active)startMP(r);
  if(ids[0]===me){
    if(r.state==="lobby"&&ids.length>=2&&ids.every(i=>ps[i].ready)){
      const u={state:"playing",seed:(Math.random()*1e9)|0,round:(r.round||0)+1};
      ids.forEach(i=>{u["players/"+i+"/alive"]=true;u["players/"+i+"/ready"]=false;u["players/"+i+"/score"]=0});
      window.MPB.update("rooms/"+MP.code,u).catch(()=>{});
    }else if(r.state==="playing"&&ids.every(i=>!ps[i].alive)){
      window.MPB.update("rooms/"+MP.code,{state:"lobby"}).catch(()=>{});
    }
  }
}
function startMP(r){
  MP.round=r.round;MP.active=true;MP.ghosts={};MP.sendT=0;MP.spec=null;
  rnd=mulberry32(r.seed||1);
  reset();state="play";MP.count=150;
  beep(520,.15,"triangle",.08,300);
}
function mpTick(){
  if(++MP.sendT%6)return;
  const a=maxH+(H-P.y);

function mpDied(total){
  MP.active=false;state="lobby";startSpectate();

function drawGhosts(cam=maxH,focus=null){
  const r=MP.room;if(!r||!r.pos||!r.players)return;

  ctx.fillStyle="#bdeaff";ctx.fillRect(0,0,W,H);
  cloud((t*.2)%520-100,200,.9);cloud((t*.12+250)%520-100,420,1);
  shad(110,8,180,42,14);rr(110,8,180,42,14);outline("#ff6b8b");text("LOBBY",W/2,40,30);
  shad(60,58,280,76,18);rr(60,58,280,76,18);outline("#fff3b0");
  ctx.setLineDash([7,5]);rr(67,65,266,62,12);ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.setLineDash([]);
  text("RAUM-CODE  -  tippen zum Kopieren",W/2,81,12,"#fff");
  const cd=(MP.code||"").padEnd(5," ");
  for(let k=0;k<5;k++){rr(84+k*48,88,40,40,10);outline("#fff");text(cd[k],104+k*48,119,30,"#ffd23f")}
  const r=MP.room,ps=(r&&r.players)||{},me=uid();
  const ids=Object.keys(ps).sort((a,b)=>ps[a].slot-ps[b].slot);
  for(let i=0;i<4;i++){
    const y=146+i*92,id=ids.find(k=>ps[k].slot===i),p=id?ps[id]:null;
    shad(20,y,360,84,16);
    if(!p){
      rr(20,y,360,84,16);ctx.fillStyle="#fffbe8";ctx.fill();ctx.setLineDash([9,7]);ctx.lineWidth=3;ctx.strokeStyle="#c9b8ff";ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(58,y+42,14,0,7);outline(SC[i]);text(String(i+1),58,y+50,20);
      ctx.beginPath();ctx.arc(112,y+42,28,0,7);ctx.fillStyle="#efe6ff";ctx.fill();text("?",112,y+56,38);
      text("Warte auf Spieler"+".".repeat(1+(t/20|0)%3),152,y+48,17,"#c9b8ff","left");
      continue;
    }
    rr(20,y,360,84,16);outline(id===me?"#d7ffd0":"#fffdf2");
    ctx.save();rr(20,y,360,84,16);ctx.clip();ctx.fillStyle=SC[i];ctx.fillRect(20,y,18,84);ctx.restore();
    rr(20,y,360,84,16);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    ctx.beginPath();ctx.arc(58,y+42,14,0,7);outline(SC[i]);text(String(i+1),58,y+50,20);
    if(id===ids[0]){ctx.beginPath();ctx.moveTo(49,y+27);ctx.lineTo(49,y+14);ctx.lineTo(54,y+20);ctx.lineTo(58,y+11);ctx.lineTo(62,y+20);ctx.lineTo(67,y+14);ctx.lineTo(67,y+27);ctx.closePath();outline("#ffd23f")}
    ctx.save();ctx.beginPath();ctx.arc(112,y+42,28,0,7);ctx.clip();
    ctx.fillStyle="#8fe3ff";ctx.fillRect(84,y+14,56,56);
    preview(112,y+38-(p.ready?Math.abs(Math.sin(t*.12+i))*7:0),colV(p.col||"orange"),p.hat||"none",.8);
    ctx.restore();
    ctx.beginPath();ctx.arc(112,y+42,28,0,7);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    text(p.name||"Spieler",152,y+34,20,"#fff","left");
    if(p.ready){
      text("bereit",152,y+62,15,"#6bd96b","left");
      ctx.save();ctx.translate(334,y+44);ctx.rotate(.12+Math.sin(t*.1)*.05);rr(-44,-16,88,32,10);outline("#6bd96b");text("BEREIT!",0,7,18);ctx.restore();
    }else{
      text(p.alive?"spielt...":p.score>0?"Letzte Runde: "+p.score:"wartet...",152,y+62,15,"#fff","left");
      ctx.fillStyle="#c9b8ff";for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(322+k*14,y+44+Math.sin(t*.1+k)*4,4,0,7);ctx.fill()}
    }
  }
  const m=ps[me];
  btn3d(20,522,170,50,m&&m.ready?"NICHT BEREIT":"BEREIT!",m&&m.ready?"#ffd23f":"#6bd96b",24);
  btn3d(210,522,170,50,"VERLASSEN","#ff6b8b",24);
  if(MP.msgT>0){MP.msgT--;wrapText(MP.msg,W/2,603,16,"#ff6b8b")}
  else text(ids.length<2?"Warte auf mindestens einen Mitspieler":"Los geht es, sobald alle bereit sind",W/2,606,16,"#fff");

function lobbyClick(x,y){
  if(hit(x,y,{x:60,y:58,w:280,h:76})){
    try{navigator.clipboard.writeText(MP.code).then(()=>toast("Code kopiert!"),()=>toast("Kopieren nicht möglich."))}catch(e){toast("Kopieren nicht möglich.")}
    return;
  }
  if(hit(x,y,{x:210,y:522,w:170,h:50})){leaveRoom();return}
  if(hit(x,y,{x:20,y:522,w:170,h:50})){
    const m=MP.room&&MP.room.players&&MP.room.players[uid()];if(!m)return;
    window.MPB.update("rooms/"+MP.code+"/players/"+uid(),{ready:!m.ready,name:SV.name||"Spieler",col:SV.eq.col,hat:SV.eq.hat}).catch(()=>{});
    beep(640,.08,"triangle");
  }
}
// --- Zuschauer-Modus ---
const pingpong=(v,max)=>{const m=((v%(2*max))+2*max)%(2*max);return m>max?2*max-m:m};
function specWorld(seed){
  const R=mulberry32(seed||1);
  return{list:[{x:W/2-50,x0:W/2-50,alt:0,w:100,type:"n",vx:0}],alt:0,gen(upto){
    while(this.alt<upto){
      const diff=Math.min(1,this.alt/9000),gap=48+diff*60+R()*30;
      this.alt+=gap;
      const pw=Math.max(54,86-diff*30),x=R()*(W-pw),r=R();let type="n";
      if(r<.18+diff*.15)type="m";else if(r<.30+diff*.2)type="b";else if(r<.38+diff*.05)type="s";
      const vx=type==="m"?(R()<.5?-1:1)*(1+diff*1.5):0;
      if(R()<.45&&type!=="s")R();
      this.list.push({x,x0:x,alt:this.alt,w:pw,type,vx});
    }
  }};
}
function specIds(){
  const r=MP.room;if(!r||!r.pos||!r.players)return[];
  const me=uid();
  return Object.keys(r.pos).filter(id=>id!==me&&r.players[id]&&r.players[id].alive).sort((a,b)=>r.players[a].slot-r.players[b].slot);
}
function startSpectate(){
  const ids=specIds();
  if(!ids.length){MP.spec=null;state="lobby";return}
  const r=MP.room;
  MP.spec={id:ids[0],cam:r.pos[ids[0]].a-H*.45,world:specWorld(r.seed)};
  state="spectate";
}
function specSwitch(d){
  const ids=specIds();if(!ids.length||!MP.spec)return;
  const i=(ids.indexOf(MP.spec.id)+d+ids.length)%ids.length;
  MP.spec.id=ids[i];beep(640,.06,"triangle");
}
function specLeave(){MP.spec=null;state="lobby";beep(500,.08,"triangle")}
function specClick(x,y){
  if(hit(x,y,{x:20,y:572,w:170,h:50})){specLeave();return}
  if(hit(x,y,{x:210,y:572,w:170,h:50}))specSwitch(1);
}
function drawSpectate(){
  const r=MP.room,sp=MP.spec,ids=specIds();
  if(!r||!sp||!ids.length){specLeave();return}
  if(!ids.includes(sp.id))sp.id=ids[0];
  const q=r.pos[sp.id],pl=r.players[sp.id];
  sp.cam+=(q.a-H*.45-sp.cam)*.12;const cam=sp.cam;
  ctx.fillStyle=skyColor(cam);ctx.fillRect(0,0,W,H);
  clouds.forEach(cl=>cloud(cl.x,cl.y,cl.s));
  sp.world.gen(cam+H+120);
  sp.world.list.forEach(p=>{
    const y=H-70-(p.alt-cam);
    if(y<-30||y>H+30)return;
    drawPlat({x:p.type==="m"?pingpong(p.x0+p.vx*t,W-p.w):p.x,y,w:p.w,h:16,type:p.type});
  });
  drawGhosts(cam,sp.id);
  shad(60,8,280,52,18);rr(60,8,280,52,18);outline("#fffdf2");
  text("Du schaust zu:",W/2,26,13,"#a77bff");
  text((pl.name||"Spieler").slice(0,14),W/2,52,26,"#ffd23f");
  text("Höhe: "+Math.max(0,Math.floor(q.a/10)),W/2,84,16,"#fff");
  btn3d(20,572,170,50,"ZURÜCK ZUR LOBBY","#a77bff",19);
  btn3d(210,572,170,50,"SWITCH SPIELER","#5bb8ff",19);
}

function openJoin(){joinOpen=true;$a("joinDlg").hidden=false;$a("joinErr").textContent="";$a("joinIn").value="";setTimeout(()=>$a("joinIn").focus(),50)}
function closeJoin(){joinOpen=false;$a("joinDlg").hidden=true}
async function doJoin(){
  $a("joinErr").textContent="Einen Moment...";
  const e=await joinRoom($a("joinIn").value);
  if(e)$a("joinErr").textContent=e;else closeJoin();
}
$a("joinOk").onclick=doJoin;$a("joinNo").onclick=closeJoin;
$a("joinIn").onkeydown=e=>{if(e.key==="Enter")doJoin()};

// ---------- Admin-Panel (PIN-geschützt, nur lokal) ----------
let admOpen=false,god=false,tapN=0,tapT=0,seqBuf="";
const $=id=>document.getElementById(id);
function hsh(v){let h=5381;for(const ch of v)h=((h<<5)+h+ch.charCodeAt(0))|0;return String(h)}
function getPin(){try{return localStorage.getItem("blobbo-pin")}catch(e){return null}}
function setPin(v){try{localStorage.setItem("blobbo-pin",hsh(v));return true}catch(e){return false}}
let memPin=null;
function stat(){$("stat").textContent="Münzen: "+SV.coins+"  |  Items: "+SV.own.length}
function openAdmin(){
  admOpen=true;$("adm").hidden=false;$("msg2").textContent="";$("pin").value="";
  const has=(getPin()||memPin)!==null&&(getPin()||memPin)!==undefined;
  $("tools").hidden=true;$("lock").hidden=false;
  $("pinInfo").textContent=has?"PIN eingeben":"Wähle einen PIN (mind. 4 Zeichen)";
  setTimeout(()=>$("pin").focus(),50);
}
function closeAdmin(){admOpen=false;$("adm").hidden=true}
function tryPin(){
  const v=$("pin").value;
  if(v.length<4){$("msg2").textContent="Mindestens 4 Zeichen.";return}
  const cur=getPin()||memPin;
  if(!cur){if(!setPin(v))memPin=hsh(v)}
  else if(cur!==hsh(v)){$("msg2").textContent="Falscher PIN.";beep(200,.2,"sawtooth");return}
  $("lock").hidden=true;$("tools").hidden=false;$("msg2").textContent="Zugriff erlaubt.";stat();
}
$("pinGo").onclick=tryPin;
$("pin").onkeydown=e=>{if(e.key==="Enter")tryPin()};
$("admClose").onclick=closeAdmin;
document.querySelectorAll("#tools [data-c]").forEach(b=>b.onclick=()=>{SV.coins+=+b.dataset.c;save();stat();beep(880,.15,"triangle")});
$("setGo").onclick=()=>{const n=Math.max(0,Math.floor(+$("setN").value));if(isFinite(n)){SV.coins=n;save();stat();beep(880,.15,"triangle")}};
$("unlock").onclick=()=>{for(const k in ITEMS)ITEMS[k].forEach(i=>{const key=k+":"+i.id;if(!SV.own.includes(key))SV.own.push(key)});save();stat();$("msg2").textContent="Alle Items freigeschaltet."};
$("god").onclick=()=>{god=!god;$("god").textContent="Gott-Modus: "+(god?"an":"aus")};
$("pinSet").onclick=()=>{const v=$("newPin").value;if(v.length<4){$("msg2").textContent="Mindestens 4 Zeichen.";return}if(setPin(v)){memPin=null;$("msg2").textContent="PIN geändert."}else{memPin=hsh(v);$("msg2").textContent="PIN nur für diese Sitzung gesetzt."}$("newPin").value=""};
$("wipe").onclick=()=>{if(!$("wipe").dataset.s){$("wipe").dataset.s=1;$("wipe").textContent="Sicher? Nochmal tippen";return}
  delete $("wipe").dataset.s;$("wipe").textContent="Fortschritt löschen";
  SV={coins:0,own:["col:orange","hat:none","trail:none"],eq:{col:"orange",hat:"none",trail:"none"}};best=0;
  try{localStorage.removeItem("blobbo-best")}catch(e){}save();stat();$("msg2").textContent="Zurückgesetzt."};

reset();state="menu";
(function loop(){update();draw();if(state==="shop")drawShop();if(state==="settings")drawSettings();if(state==="mp")drawMP();if(state==="board")drawBoard();if(state==="spectate")drawSpectate();if(state==="lobby")drawLobby();requestAnimationFrame(loop)})();
})();
</script>
