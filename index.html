<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blobbo Hop</title>
<style>
:root{--bg:#ffe9a8;--ink:#2b2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a2d63}}
:root[data-theme="dark"]{--bg:#3a2d63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Bangers","Comic Sans MS","Chalkboard SE",cursive,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{border:5px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#8fe3ff;max-width:100%;max-height:100%}
:root{--card:#fffdf2;--txt:#2b2140}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#4a3b7a;--txt:#fff}}
:root[data-theme="dark"]{--card:#4a3b7a;--txt:#fff}
#adm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#adm[hidden]{display:none}
#adm .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#adm h2{margin:0 0 10px;font-size:30px;font-weight:400}
#adm button,#adm input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#adm input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#adm button.red{background:#ff6b8b}#adm button.blue{background:#5bb8ff}
#adm p{margin:6px 0;min-height:1.2em}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.75);touch-action:auto;z-index:9}
#auth[hidden]{display:none}
#auth .box{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(92vw,340px);max-height:90%;overflow:auto;letter-spacing:.5px}
#auth h2{margin:0 0 10px;font-size:30px;font-weight:400}
#auth button,#auth input{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#ffd23f;color:#2b2140;cursor:pointer}
#auth input{background:#fff;cursor:text;width:120px;user-select:text;-webkit-user-select:text}
#auth button.red{background:#ff6b8b}#auth button.blue{background:#5bb8ff}
#auth p{margin:6px 0;min-height:1.2em}
#auth input{width:100%;box-sizing:border-box}
#auth .idc{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,#fff6d6 0 12px,#fff0bd 12px 24px);color:#2b2140;box-shadow:0 4px 0 var(--ink);margin-bottom:8px}
#auth .idh{background:#ff6b8b;color:#fff;font-size:22px;letter-spacing:2px;padding:4px 10px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 #2b2140;display:flex;justify-content:space-between}
#auth .idb{display:flex;gap:12px;padding:12px}
#auth #avatar{width:96px;height:96px;border:4px solid var(--ink);border-radius:14px;transform:rotate(-3deg);flex:none;background:#8fe3ff}
#auth .idi{min-width:0;flex:1}
#auth .lbl{font-size:12px;letter-spacing:1px;color:#8a7ba8;margin-top:4px}
#auth .nm{font-size:26px;display:flex;align-items:center;gap:4px;line-height:1.1}
#auth .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#auth .nm button,#auth .nb button{padding:1px 6px;font-size:16px;margin:0}
#auth .nb{display:flex;gap:4px}
#auth .nb input{min-width:0;font-size:18px;padding:3px 6px;margin:0}
#auth .sm{font-size:13px;overflow:hidden;text-overflow:ellipsis}
#auth .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 10px}
#auth .stats div{background:#fff;border:3px solid var(--ink);border-radius:10px;text-align:center;padding:3px 2px}
#auth .stats b{display:block;font-size:22px;font-weight:400}
#auth .stats span{font-size:11px;color:#8a7ba8}
#auth .idf{display:flex;align-items:center;gap:8px;border-top:3px dashed var(--ink);padding:6px 12px;font-size:13px}
#auth .bar{flex:1;height:18px;background:repeating-linear-gradient(90deg,#2b2140 0 2px,transparent 2px 5px,#2b2140 5px 9px,transparent 9px 11px)}
#auth .nm button{display:flex;align-items:center}
#nameDlg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,33,64,.6)}
#nameDlg[hidden]{display:none}
#nameDlg .dlg{background:var(--card);color:var(--txt);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(80vw,280px)}
#nameDlg h3{margin:0 0 8px;font-size:26px;font-weight:400}
#nameDlg input,#nameDlg button{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:3px 3px 3px 0;background:#fff;color:#2b2140;width:100%;box-sizing:border-box}
#nameDlg button{width:auto;cursor:pointer;background:#ffd23f}
#nameDlg button.blue{background:#5bb8ff}#nameDlg button.red{background:#ff6b8b}
#nameDlg p{margin:4px 0;min-height:1.2em;color:#ff6b8b}
</style>
</head>
<body>
<canvas id="c" aria-label="Blobbo Hop Spiel"></canvas>
<div id="auth" hidden><div class="box">
<h2>Account</h2>
<div id="aOut"><input id="aName" maxlength="14" autocomplete="nickname" placeholder="Spielername (zum Registrieren)"><input id="aMail" type="email" autocomplete="email" placeholder="E-Mail"><input id="aPw" type="password" autocomplete="current-password" placeholder="Passwort (min. 6 Zeichen)"><button id="aLogin" class="blue">Einloggen</button><button id="aReg">Registrieren</button></div>
<div id="aIn" hidden>
<div class="idc">
 <div class="idh"><span>BLOBBO-AUSWEIS</span><span>★</span></div>
 <div class="idb">
  <canvas id="avatar" width="120" height="120"></canvas>
  <div class="idi">
   <div class="lbl">NAME</div>
   <div class="nm"><span id="nameTxt"></span><button id="nameEdit" title="Name ändern" aria-label="Name ändern"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4.5 15.5L16 4l4 4L8.5 19.5z" fill="#fff" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="#2b2140" stroke-width="2"/><path d="M3 21l1.5-5.5 4 4z" fill="#ff6b8b" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
   <div class="lbl">E-MAIL</div><div class="sm" id="aMail2"></div>
  </div>
 </div>
 <div class="stats"><div><b id="stCoins">0</b><span>Münzen</span></div><div><b id="stTotal">0</b><span>Gesamt</span></div><div><b id="stBest">0</b><span>Highscore</span></div></div>
 <div class="idf"><span>ID <span id="idNo"></span></span><div class="bar"></div></div>
</div>
<button id="aSave" class="blue">Jetzt speichern</button><button id="aLogout" class="red">Ausloggen</button></div>
<p id="aMsg"></p><button id="aClose" class="red">Schließen</button>
</div>
<div id="nameDlg" hidden><div class="dlg">
<h3>Neuer Name</h3>
<input id="nameIn" maxlength="14" placeholder="Dein Name">
<p id="nameErr"></p>
<button id="nameOk" class="blue">Speichern</button><button id="nameNo" class="red">Abbrechen</button>
</div></div>
</div>
<div id="adm" hidden><div class="box">
<h2>Admin-Panel</h2>
<div id="lock"><p id="pinInfo"></p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button id="pinGo">OK</button></div>
<div id="tools" hidden>
<p id="stat"></p>
<button data-c="100">+100</button><button data-c="1000">+1.000</button><button data-c="10000">+10.000</button>
<div><input id="setN" type="number" min="0" placeholder="Münzen"><button id="setGo" class="blue">Setzen</button></div>
<div><button id="unlock" class="blue">Alles freischalten</button><button id="god" class="blue">Gott-Modus: aus</button></div>
<div><input id="newPin" type="password" inputmode="numeric" placeholder="Neuer PIN"><button id="pinSet" class="blue">PIN ändern</button></div>
<div><button id="wipe" class="red">Fortschritt löschen</button></div>
</div>
<p id="msg2"></p>
<button id="admClose" class="red">Schließen</button>
</div></div>
<script>
(()=>{
const W=400,H=640,INK="#2b2140";
const c=document.getElementById("c");let ctx=c.getContext("2d");
c.width=W*2;c.height=H*2;ctx.scale(2,2);
function fit(){const pad=24,s=Math.min((innerWidth-pad)/W,(innerHeight-pad-12)/H);c.style.width=W*s+"px";c.style.height=H*s+"px"}
addEventListener("resize",fit);fit();

// ---------- Einstellungen ----------
let ST={sound:true,vol:1,shake:true,fx:true,kl:"a",kr:"d"};
try{Object.assign(ST,JSON.parse(localStorage.getItem("blobbo-set")))}catch(e){}
function saveST(){try{localStorage.setItem("blobbo-set",JSON.stringify(ST))}catch(e){}}
// ---------- Audio ----------
let AC=null;
function beep(f,d=.12,type="square",v=.06,slide=0){
  if(!ST.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
    g.gain.value=v*[.4,1,1.8][ST.vol];g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- State ----------
let best=0;
try{best=+localStorage.getItem("blobbo-best")||0}catch(e){}
let state="menu",score=0,bonus=0,combo=0,comboT=0,shake=0,t=0,coinsTotal=0;
let P,plats,coins,parts,pops,clouds,topY,maxH;
const keys={};let ptr=null,rel=null,holdDir=0;
// ---------- Shop-Daten ----------
const ITEMS={
 col:[{id:"orange",n:"Orange",p:0,v:"#ff8c42"},{id:"mint",n:"Minze",p:30,v:"#4fd6a4"},{id:"pink",n:"Bubblegum",p:40,v:"#ff7eb6"},{id:"blue",n:"Wolke",p:50,v:"#5bb8ff"},{id:"purple",n:"Traube",p:80,v:"#a77bff"},{id:"gold",n:"Gold",p:150,v:"#ffd23f"}],
 hat:[{id:"none",n:"Kein Hut",p:0},{id:"cap",n:"Kappe",p:40},{id:"party",n:"Partyhut",p:60},{id:"top",n:"Zylinder",p:80},{id:"halo",n:"Heiligenschein",p:120},{id:"crown",n:"Krone",p:200}],
 trail:[{id:"none",n:"Keine Spur",p:0},{id:"bubble",n:"Blasen",p:40},{id:"spark",n:"Funken",p:60},{id:"rainbow",n:"Regenbogen",p:120}]
};
let SV={coins:0,own:["col:orange","hat:none","trail:none"],eq:{col:"orange",hat:"none",trail:"none"}};
try{const o=JSON.parse(localStorage.getItem("blobbo-save"));if(o&&o.own&&o.eq)SV=o}catch(e){}
function save(){try{localStorage.setItem("blobbo-save",JSON.stringify(SV))}catch(e){}cloudSave()}
function cloudSave(){const F=window.FB;if(F&&F.user)F.save({name:SV.name||"Spieler",total:SV.total||0,coins:SV.coins,own:SV.own,eq:SV.eq,best}).catch(()=>{})}
const AB={x:120,y:536,w:160,h:44},GB={x:120,y:586,w:160,h:44};
function acctBtn(){btn(AB.x,AB.y,AB.w,AB.h,(window.FB&&window.FB.user)?"ACCOUNT":"LOG IN","#5bb8ff");btn(GB.x,GB.y,GB.w,GB.h,"SETTINGS","#a77bff")}
const CH={x:10,y:10,w:158,h:48};
function pencil(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(.8);rr(-3,-10,6,15,1);outline("#ffd23f");ctx.beginPath();ctx.moveTo(-3,5);ctx.lineTo(3,5);ctx.lineTo(0,11);ctx.closePath();outline("#ffe9a8");ctx.restore()}
function chip(){
  const u=window.FB&&window.FB.user,nm=u?(SV.name||"Spieler"):"Gast";
  rr(CH.x,CH.y,CH.w,CH.h,16);outline("#fffdf2");
  ctx.save();ctx.beginPath();ctx.arc(36,34,19,0,7);ctx.clip();
  ctx.fillStyle="#8fe3ff";ctx.fillRect(10,10,52,48);
  preview(36,27.4,colV(SV.eq.col),SV.eq.hat,.65);
  ctx.restore();
  ctx.beginPath();ctx.arc(36,34,19,0,7);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  text(nm.length>9?nm.slice(0,8)+"…":nm,62,40,18,"#fff","left");
  if(u)pencil(152,34);
}
function colV(id){return ITEMS.col.find(i=>i.id===id).v}
let ovr=null,tab="col",msg="",msgT=0,gain=0;
const SB={x:120,y:486,w:160,h:44};
function hit(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function drawHat(h){
  if(h==="cap"){ctx.beginPath();ctx.arc(0,-8,17,Math.PI,0);ctx.closePath();outline("#4a90ff");rr(2,-13,24,7,3);outline("#2f6fd6")}
  else if(h==="party"){ctx.beginPath();ctx.moveTo(-12,-14);ctx.lineTo(0,-44);ctx.lineTo(12,-14);ctx.closePath();outline("#ff6b8b");ctx.beginPath();ctx.arc(0,-45,5,0,7);outline("#ffd23f")}
  else if(h==="top"){rr(-13,-44,26,28,4);outline("#3b3355");rr(-13,-27,26,6,0);ctx.fillStyle="#ff6b8b";ctx.fill();rr(-21,-19,42,7,3);outline("#3b3355")}
  else if(h==="crown"){ctx.beginPath();ctx.moveTo(-14,-14);ctx.lineTo(-15,-32);ctx.lineTo(-7,-23);ctx.lineTo(0,-34);ctx.lineTo(7,-23);ctx.lineTo(15,-32);ctx.lineTo(14,-14);ctx.closePath();outline("#ffd23f")}
  else if(h==="halo"){ctx.beginPath();ctx.ellipse(0,-30+Math.sin(t*.1)*2,14,5,0,0,7);ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle="#ffd23f";ctx.stroke()}
}
function preview(x,y,col,hat,sc=1.1){
  const sp=P;ovr={col,hat};
  P={x,y,vx:0,vy:0,sx:sc,sy:sc,face:1,r:19};drawBlob();P=sp;ovr=null;
}
function closeShop(){bindKey=null;reset();state="menu";beep(500,.08,"triangle")}
function shopClick(x,y){
  const tabs=["col","hat","trail"];
  for(let i=0;i<3;i++)if(hit(x,y,{x:20+i*125,y:76,w:115,h:38})){tab=tabs[i];beep(600,.05);return}
  if(hit(x,y,{x:120,y:584,w:160,h:40})){closeShop();return}
  ITEMS[tab].forEach((it,i)=>{
    if(!hit(x,y,{x:20+(i%2)*190,y:130+Math.floor(i/2)*150,w:170,h:138}))return;
    const key=tab+":"+it.id;
    if(SV.own.includes(key)){SV.eq[tab]=it.id;save();beep(640,.08,"triangle")}
    else if(SV.coins>=it.p){SV.coins-=it.p;SV.own.push(key);SV.eq[tab]=it.id;save();beep(880,.25,"triangle",.08,400);msg="Gekauft!";msgT=70}
    else{msg="Zu wenig Münzen!";msgT=90;beep(200,.2,"sawtooth")}
  });
}
function btn(x,y,w,h,label,col){rr(x,y,w,h,14);outline(col);text(label,x+w/2,y+h*.7,h*.5)}
const SROWS=[["Vollbild","fs"],["Sound","sound"],["Lautstärke","vol"],["Screenshake","shake"],["Effekte","fx"],["Taste Links","kl"],["Taste Rechts","kr"]];
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){
  const d=document,el=d.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  const fail=()=>{msg="Vollbild geht hier leider nicht";msgT=100};
  try{
    if(isFS())Promise.resolve((d.exitFullscreen||d.webkitExitFullscreen).call(d)).catch(fail);
    else if(req)Promise.resolve(req.call(el)).catch(fail);
    else fail();
  }catch(e){fail()}
}
let bindKey=null;
const kname=k=>{const m={" ":"Space",arrowleft:"←",arrowright:"→",arrowup:"↑",arrowdown:"↓"};return (m[k]||k).toUpperCase()};
const RY=i=>84+i*60;
function setClick(x,y){
  if(hit(x,y,{x:120,y:584,w:160,h:40})){closeShop();return}
  SROWS.forEach(([l,k],i)=>{
    if(!hit(x,y,{x:20,y:RY(i),w:360,h:50}))return;
    if(k==="fs")toggleFS();
    else if(k==="vol")ST.vol=(ST.vol+1)%3;
    else if(k==="kl"||k==="kr")bindKey=bindKey===k?null:k;
    else ST[k]=!ST[k];
    saveST();beep(640,.08,"triangle");
  });
}
function drawSettings(){
  ctx.fillStyle="#ffe9a8";ctx.fillRect(0,0,W,H);
  text("SETTINGS",W/2,60,46,"#a77bff");
  SROWS.forEach(([l,k],i)=>{
    const y=RY(i);rr(20,y,360,50,16);outline("#fffdf2");text(l,40,y+34,22,"#fff","left");
    if(k==="vol"){rr(250,y+8,116,34,12);outline("#ffd23f");text(["Leise","Mittel","Laut"][ST.vol],308,y+32,20)}
    else if(k==="kl"||k==="kr"){rr(236,y+8,130,34,12);outline(bindKey===k?"#ff6b8b":"#ffd23f");text(bindKey===k?"Taste...":kname(ST[k]),301,y+32,20)}
    else{const on=k==="fs"?isFS():ST[k];rr(290,y+9,76,32,16);outline(on?"#6bd96b":"#c8c0d8");ctx.beginPath();ctx.arc(on?350:306,y+25,12,0,7);outline("#fff")}
  });
  if(bindKey)text("Drück jetzt eine Taste (Esc = Abbrechen)",W/2,524,17,"#ff6b8b");
  else if(msgT>0){msgT--;text(msg,W/2,524,18,"#ff6b8b")}
  text("Mehr Optionen bald!",W/2,560,20,"#ffd23f");
  btn(120,584,160,40,"Zurück","#5bb8ff");
}
function drawShop(){
  ctx.fillStyle="#ffe9a8";ctx.fillRect(0,0,W,H);
  text("SHOP",W/2,60,52,"#ff6b8b");
  ctx.beginPath();ctx.ellipse(W-90,36,11,11,0,0,7);outline("#ffd23f");text(SV.coins,W-72,46,28,"#fff","left");
  [["col","Farben"],["hat","Hüte"],["trail","Spuren"]].forEach(([id,l],i)=>{rr(20+i*125,76,115,38,12);outline(tab===id?"#ff6b8b":"#c9b8ff");text(l,77+i*125,104,22)});
  ITEMS[tab].forEach((it,i)=>{
    const cx=20+(i%2)*190,cy=130+Math.floor(i/2)*150,own=SV.own.includes(tab+":"+it.id),act=SV.eq[tab]===it.id;
    rr(cx,cy,170,138,16);outline(act?"#d7ffd0":"#fffdf2");
    const col=tab==="col"?it.v:colV(SV.eq.col),hat=tab==="hat"?it.id:SV.eq.hat;
    preview(cx+85,cy+50,col,hat);
    if(tab==="trail"&&it.id!=="none")for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(cx+24+k*10,cy+28+k*14,5,0,7);outline(it.id==="rainbow"?`hsl(${k*120},90%,60%)`:it.id==="spark"?"#ffd23f":"#fff")}
    text(it.n,cx+85,cy+91,18,"#fff");
    const aff=SV.coins>=it.p;
    rr(cx+20,cy+98,130,34,12);outline(act?"#6bd96b":own?"#5bb8ff":aff?"#ffd23f":"#c8c0d8");
    text(act?"Aktiv":own?"Ausrüsten":"Kaufen  "+it.p,cx+85,cy+123,20);
  });
  if(msgT>0){msgT--;text(msg,W/2,578,18,"#ff6b8b")}
  btn(120,584,160,40,"Zurück","#5bb8ff");
}

function reset(){
  P={x:W/2,y:H-120,vx:0,vy:-11,sx:1,sy:1,face:1,r:19};
  plats=[];coins=[];parts=[];pops=[];
  plats.push({x:W/2-50,y:H-70,w:100,h:16,type:"n",vx:0});
  topY=H-70;maxH=0;score=0;bonus=0;combo=0;coinsTotal=0;
  genPlats();
  if(!clouds)clouds=Array.from({length:7},(_,i)=>({x:Math.random()*W,y:i*95,s:.6+Math.random()*.9}));
}
function genPlats(){
  while(topY>-120){
    const diff=Math.min(1,maxH/9000);
    topY-=48+diff*60+Math.random()*30;
    const w=Math.max(54,86-diff*30),x=Math.random()*(W-w);
    const r=Math.random();let type="n";
    if(r<.18+diff*.15)type="m";
    else if(r<.30+diff*.2)type="b";
    else if(r<.38+diff*.05)type="s";
    const p={x,y:topY,w,h:16,type,vx:type==="m"?(Math.random()<.5?-1:1)*(1+diff*1.5):0};
    plats.push(p);
    if(Math.random()<.45&&type!=="s")coins.push({x:x+w/2,y:topY-34,got:false,ph:Math.random()*6});
  }
}
function burst(x,y,col,n=10,sp=4){
  if(!ST.fx)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,col,r:3+Math.random()*4})}
}
function pop(x,y,txt,col="#fff"){pops.push({x,y,txt,col,l:1})}

// ---------- Input ----------
addEventListener("keydown",e=>{if(bindKey){if(e.key!=="Escape"){ST[bindKey]=e.key.toLowerCase();saveST();beep(760,.1,"triangle")}bindKey=null;e.preventDefault();return}if(admOpen||authOpen)return;seqBuf=(seqBuf+e.key).slice(-4);if(seqBuf==="2911"){seqBuf="";openAdmin();return}keys[e.key.toLowerCase()]=true;if((state==="shop"||state==="settings")&&e.key==="Escape")closeShop();if(e.key.toLowerCase()==="s"&&(state==="menu"||state==="over"))state="shop";if(e.key===" "||e.key==="Enter")start();if(e.key.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function gx(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
const dirOf=e=>{const r=c.getBoundingClientRect();return e.clientX<r.left+r.width/2?-1:1};
function gy(e){const r=c.getBoundingClientRect();return (e.clientY-r.top)/r.height*H}
addEventListener("pointerdown",e=>{
  if(admOpen||authOpen||e.target.closest("#adm,#auth"))return;
  const x=gx(e),y=gy(e);
  if(state==="shop"){shopClick(x,y);return}
  if(state==="settings"){setClick(x,y);return}
  if((state==="menu"||state==="over")&&hit(x,y,SB)){state="shop";beep(500,.08,"triangle");return}
  if(state==="menu"&&hit(x,y,CH)){openAuth();if(window.FB&&window.FB.user&&x>CH.x+CH.w-34)startEdit();return}
  if((state==="menu"||state==="over")&&hit(x,y,AB)){openAuth();return}
  if((state==="menu"||state==="over")&&hit(x,y,GB)){state="settings";beep(500,.08,"triangle");return}
  if(state==="menu"&&x<60&&y>H-60){const n=performance.now();tapN=(n-tapT<2000)?tapN+1:1;tapT=n;if(tapN>=5){tapN=0;openAdmin();return}}
  if(e.pointerType!=="mouse"){holdDir=dirOf(e);ptr=null}else ptr=Math.max(0,Math.min(W,x));
  start();
});
addEventListener("pointermove",e=>{
  if(ptr!==null||e.pointerType==="mouse")ptr=Math.max(0,Math.min(W,gx(e)));
  if(holdDir&&e.pointerType!=="mouse")holdDir=dirOf(e);
});
const upF=e=>{if(e.pointerType!=="mouse"){ptr=null;holdDir=0}};
addEventListener("pointerup",upF);addEventListener("pointercancel",upF);
function start(){
  if(state==="play"||state==="shop"||state==="settings")return;
  if(state==="over"&&t-overAt<40)return;
  reset();state="play";beep(520,.15,"triangle",.08,300);
}
let overAt=0;
function gameOver(){
  state="over";overAt=t;shake=14;beep(300,.5,"sawtooth",.08,-250);
  const total=Math.floor(score+bonus);
  gain=coinsTotal+Math.floor(total/200);SV.coins+=gain;SV.total=(SV.total||0)+gain;if(total>best){best=total;try{localStorage.setItem("blobbo-best",best)}catch(e){}}
  save();
  burst(P.x,H-30,"#ff6b8b",30,7);
}

// ---------- Update ----------
function update(){
  t++;
  clouds&&clouds.forEach(cl=>{cl.x+=.15*cl.s;if(cl.x>W+80)cl.x=-80});
  if(state!=="play"){
    if(state==="menu"){P=P||{x:W/2,y:H-120,vx:0,vy:-11,sx:1,sy:1,face:1,r:19};}
    updFx();return;
  }
  // steer
  let ax=0;
  if(keys.arrowleft||keys[ST.kl])ax=-1;
  if(keys.arrowright||keys[ST.kr])ax=1;
  if(holdDir)P.vx+=holdDir*.8;
  else if(ptr!==null){P.vx+=Math.max(-1,Math.min(1,(ptr-P.x)/30))*.9}
  else P.vx+=ax*.8;
  P.vx*=.86;
  if(Math.abs(P.vx)>.3)P.face=Math.sign(P.vx);
  P.x+=P.vx;
  if(P.x<-P.r)P.x=W+P.r;if(P.x>W+P.r)P.x=-P.r;
  P.vy+=.45;P.y+=P.vy;
  const tr=SV.eq.trail;
  if(tr!=="none"&&t%2===0)parts.push({x:P.x+(Math.random()-.5)*12,y:P.y+P.r*.6,vx:(Math.random()-.5),vy:.5,l:.8,col:tr==="rainbow"?`hsl(${t*8%360},90%,60%)`:tr==="spark"?"#ffd23f":"#fff",r:tr==="bubble"?7:4});
  P.sx+=(1-P.sx)*.18;P.sy+=(1-P.sy)*.18;
  if(P.vy>0)P.sy=Math.min(1.25,1+P.vy*.015),P.sx=1/P.sy;

  // platforms
  plats.forEach(p=>{
    if(p.type==="m"){p.x+=p.vx;if(p.x<0||p.x+p.w>W)p.vx*=-1}
    if(p.dead){p.fall=(p.fall||0)+1;p.y+=p.fall*.6}
    if(P.vy>0&&!p.dead&&P.y+P.r>p.y&&P.y+P.r<p.y+p.h+P.vy+2&&P.x>p.x-8&&P.x<p.x+p.w+8){
      P.y=p.y-P.r;
      if(p.type==="s"){P.vy=-19;shake=6;beep(380,.25,"sine",.1,500);burst(P.x,p.y,"#ff6b8b",14);pop(P.x,p.y-30,"BOING!","#ff6b8b")}
      else{P.vy=-11.2;beep(260,.1,"square",.04,200)}
      if(p.type==="b"){p.dead=true;burst(p.x+p.w/2,p.y,"#b5835a",12)}
      P.sx=1.4;P.sy=.6;burst(P.x,p.y,"#fff",5,2);
    }
  });
  // coins
  coins.forEach(k=>{
    if(!k.got&&Math.hypot(k.x-P.x,k.y-P.y)<P.r+14){
      k.got=true;combo++;comboT=110;coinsTotal++;
      const pts=10*combo;bonus+=pts;
      pop(k.x,k.y-10,"+"+pts+(combo>1?" x"+combo:""),"#ffd23f");
      burst(k.x,k.y,"#ffd23f",10);beep(700+combo*60,.12,"triangle",.07,300);
    }
  });
  if(comboT>0&&--comboT===0)combo=0;
  // camera
  if(P.y<H*.4){
    const d=H*.4-P.y;P.y=H*.4;maxH+=d;score=maxH/10;
    plats.forEach(p=>p.y+=d);coins.forEach(k=>k.y+=d);topY+=d;
    parts.forEach(q=>q.y+=d);pops.forEach(q=>q.y+=d);
    clouds.forEach(cl=>{cl.y+=d*.3*cl.s;if(cl.y>H+40){cl.y=-40;cl.x=Math.random()*W}});
    genPlats();
  }
  plats=plats.filter(p=>p.y<H+60);coins=coins.filter(k=>k.y<H+60&&!k.got);
  if(P.y>H+40){if(god){P.y=H-60;P.vy=-14;P.sx=1.4;P.sy=.6}else gameOver()}
  updFx();
}
function updFx(){
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l-=.03});parts=parts.filter(q=>q.l>0);
  pops.forEach(q=>{q.y-=1;q.l-=.018});pops=pops.filter(q=>q.l>0);
  if(shake>0)shake*=.85;
}

// ---------- Draw helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function outline(fill){ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.stroke()}
function skyColor(){
  const h=Math.min(1,maxH/12000);
  const a=[[143,227,255],[255,160,122],[90,60,160]],i=h<.5?0:1,f=h<.5?h*2:(h-.5)*2;
  const m=a[i].map((v,k)=>Math.round(v+(a[i+1][k]-v)*f));
  return `rgb(${m})`;
}
function cloud(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.arc(26,-8,28,0,7);ctx.arc(54,2,20,0,7);ctx.rect(0,0,54,22);
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();ctx.restore();
}
function drawPlat(p){
  const cols={n:"#6bd96b",m:"#5bb8ff",b:"#c8925f",s:"#ff6b8b"};
  rr(p.x,p.y,p.w,p.h,8);outline(cols[p.type]);
  ctx.fillStyle="rgba(255,255,255,.4)";rr(p.x+6,p.y+3,p.w-12,3,2);ctx.fill();
  if(p.type==="s"){ // spring coil
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<4;i++){ctx.moveTo(p.x+p.w/2-10,p.y-i*4);ctx.lineTo(p.x+p.w/2+10,p.y-i*4-2)}ctx.stroke();
  }
  if(p.type==="b"){ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.4,p.y);ctx.lineTo(p.x+p.w*.5,p.y+p.h);ctx.stroke()}
}
function drawCoin(k){
  const w=Math.abs(Math.cos(t*.06+k.ph))*12+3;
  ctx.beginPath();ctx.ellipse(k.x,k.y+Math.sin(t*.08+k.ph)*3,w,13,0,0,7);outline("#ffd23f");
}
function drawBlob(){
  ctx.save();ctx.translate(P.x,P.y+P.r*(1-P.sy));ctx.scale(P.sx,P.sy);
  const sk=ovr||{col:colV(SV.eq.col),hat:SV.eq.hat};
  ctx.beginPath();ctx.ellipse(0,0,P.r,P.r,0,0,7);outline(sk.col);
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(-7,-9,6,4,-.5,0,7);ctx.fill();
  const ex=P.face*3,ey=P.vy<0?-3:0;
  [-7,7].forEach(o=>{
    ctx.beginPath();ctx.arc(o+ex,-3,6,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(o+ex+P.face*2,-3+ey*.5,2.5,0,7);ctx.fillStyle=INK;ctx.fill();
  });
  ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.beginPath();
  if(P.vy<0)ctx.arc(0,6,5,0,Math.PI);else ctx.ellipse(0,9,4,5,0,0,7);
  ctx.stroke();
  drawHat(sk.hat);
  ctx.restore();
}
function text(s,x,y,size,col="#fff",align="center"){
  ctx.font=`${size}px Bangers,"Comic Sans MS","Chalkboard SE",cursive`;ctx.textAlign=align;
  ctx.lineWidth=size/5;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.strokeText(s,x,y);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

// ---------- Draw ----------
function draw(){
  ctx.save();
  if(ST.shake&&shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle=skyColor();ctx.fillRect(-20,-20,W+40,H+40);
  clouds&&clouds.forEach(cl=>cloud(cl.x,cl.y,cl.s));
  if(plats){plats.forEach(drawPlat);coins.forEach(drawCoin)}
  if(P&&(state!=="over"||P.y<H))drawBlob();
  parts.forEach(q=>{ctx.globalAlpha=Math.max(0,q.l);ctx.beginPath();ctx.arc(q.x,q.y,q.r*q.l,0,7);ctx.fillStyle=q.col;ctx.fill();ctx.globalAlpha=1});
  pops.forEach(q=>{ctx.globalAlpha=Math.max(0,q.l);text(q.txt,q.x,q.y,24,q.col);ctx.globalAlpha=1});
  ctx.restore();

  if(state==="play"){
    text(Math.floor(score+bonus),16,44,40,"#fff","left");
    text("Rekord "+best,W-16,30,20,"#ffd23f","right");
    if(combo>1){
      text("Combo x"+combo,W-16,60,22,"#ff6b8b","right");
      ctx.fillStyle=INK;rr(W-96,68,80,8,4);ctx.fill();
      ctx.fillStyle="#ff6b8b";rr(W-96,68,80*comboT/110,8,4);ctx.fill();
    }
  }
  if(state==="menu"){
    ctx.fillStyle="rgba(43,33,64,.35)";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,170);ctx.rotate(Math.sin(t*.04)*.05);
    text("BLOBBO",0,0,84,"#ffd23f");text("HOP!",0,72,84,"#ff6b8b");ctx.restore();
    text("Tippen oder Leertaste zum Start",W/2,392,22);
    text("Pfeiltasten / "+kname(ST.kl)+" "+kname(ST.kr)+" / Finger ziehen",W/2,420,18,"#ffe9a8");
    text("Münzen sammeln = Combo, rote Feder = Turbo",W/2,446,16,"#ffe9a8");
    btn(SB.x,SB.y,SB.w,SB.h,"SHOP","#ff6b8b");acctBtn();chip();
    if(best)text("Rekord "+best,W-16,34,22,"#ffd23f","right");
  }
  if(state==="over"){
    ctx.fillStyle="rgba(43,33,64,.55)";ctx.fillRect(0,0,W,H);
    text("OOPS!",W/2,190,80,"#ff6b8b");
    const total=Math.floor(score+bonus);
    text("Punkte: "+total,W/2,270,38);
    text("Münzen: "+coinsTotal,W/2,312,26,"#ffd23f");
    text(total>=best&&total>0?"Neuer Rekord!":"Rekord "+best,W/2,356,26,"#ffd23f");
    text("+"+gain+" Münzen im Beutel ("+SV.coins+")",W/2,395,20,"#ffd23f");
    btn(SB.x,SB.y,SB.w,SB.h,"SHOP","#ff6b8b");acctBtn();
    if(Math.floor(t/20)%2===0)text("Tippen für noch eine Runde",W/2,450,24);
  }
}

function getPin(){try{return localStorage.getItem("blobbo-pin")}catch(e){return null}}

reset();state="menu";
(function loop(){update();draw();if(state==="shop")drawShop();if(state==="settings")drawSettings();requestAnimationFrame(loop)})();
})();

    logout:()=>signOut(auth),
    load:async()=>{const s=await getDoc(ref());return s.exists()?s.data():null},
    save:d=>setDoc(ref(),d)
  };
  onAuthStateChanged(auth,u=>{window.FB.user=u;window.dispatchEvent(new Event("fb-user"))});
}
</script>
</body>
</html>
