<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#392c64">
  <title>Blobbo Hop – Neue Website</title>
  <style>
    :root {
      --bg: #392c64;
      --ink: #2b2140;
      --cream: #fffdf2;
      --yellow: #ffd23f;
      --pink: #ff6b8b;
      --blue: #5bb8ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.09) 0 3px, transparent 4px),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,.08) 0 5px, transparent 6px),
        var(--bg);
      background-size: 42px 42px, 58px 58px, auto;
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
      font-weight: 700;
    }
    .card {
      position: relative;
      width: min(100%, 540px);
      padding: clamp(26px, 6vw, 44px);
      text-align: center;
      background: var(--cream);
      border: 5px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 10px 0 var(--ink);
      animation: pop-in .55s cubic-bezier(.2,.8,.2,1) both;
    }
    .blob {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-size: 39px;
      background: var(--yellow);
      border: 4px solid var(--ink);
      border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
      box-shadow: 0 5px 0 var(--ink);
      transform: rotate(-8deg);
      animation: wobble 3s ease-in-out infinite;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(27px, 7vw, 39px);
      line-height: 1.12;
      letter-spacing: .2px;
    }
    p {
      margin: 0 auto 17px;
      max-width: 420px;
      font-size: clamp(16px, 4vw, 19px);
      line-height: 1.55;
    }
    .site-link {
      display: inline-block;
      margin: 2px 0 20px;
      padding: 11px 18px;
      color: var(--ink);
      background: var(--blue);
      border: 4px solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 5px 0 var(--ink);
      font-size: clamp(17px, 4.5vw, 21px);
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .site-link:hover, .site-link:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 var(--ink);
      outline: none;
    }
    .site-link:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }
    .note {
      display: inline-block;
      padding: 9px 14px;
      color: #285b32;
      background: #d7ffd0;
      border: 3px solid var(--ink);
      border-radius: 12px;
      font-size: 15px;
    }
    .dots {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--pink);
    }
    .dot-one { top: 24px; left: 24px; }
    .dot-two { right: 25px; bottom: 25px; width: 13px; height: 13px; background: var(--yellow); }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes wobble {
      0%, 100% { border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; transform: rotate(-8deg); }
      50% { border-radius: 55% 45% 43% 57% / 42% 58% 42% 58%; transform: rotate(7deg) translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="dots dot-one" aria-hidden="true"></span>
    <span class="dots dot-two" aria-hidden="true"></span>
    <div class="blob" aria-hidden="true">B</div>
    <h1>Hallo, Blobbo-Hop-Spieler!</h1>
    <p>Diese Website wurde auf unsere neue Website geändert:</p>
    <a class="site-link" href="https://BlobboHop.github.io" target="_blank" rel="noopener noreferrer">
      BlobboHop.github.io ↗
    </a>
    <p>Keine Angst: Es gehen keine Daten verloren.</p>
    <div class="note">Viel Spaß beim Spielen! 💛</div>
  </main>
</body>
</html>
